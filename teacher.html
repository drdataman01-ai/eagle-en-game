<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Teacher Dashboard — Eagle Reading Quest</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --sky-deep:#1B4B66; --sky-bright:#3E86A0; --sun-gold:#F2A93B;
    --cloud:#F7F9FB; --ink:#1E2A32; --leaf-teal:#2E8B7E; --danger:#C25B4A;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:'Nunito',sans-serif;color:var(--ink);background:linear-gradient(180deg, var(--sky-deep) 0%, var(--sky-bright) 55%, #7FB8C9 100%);min-height:100vh;padding:24px 16px 60px;}
  h1,h2{font-family:'Baloo 2',sans-serif;}
  .wrap{max-width:960px;margin:0 auto;}
  h1{color:#fff;font-size:1.4rem;margin:0 0 18px;}
  .panel{background:var(--cloud);border-radius:20px;padding:24px;box-shadow:0 10px 0 rgba(10,40,55,.28);}
  .login-panel{max-width:380px;margin:70px auto 0;}
  .field{margin-bottom:16px;}
  .field label{display:block;font-weight:800;margin-bottom:6px;color:var(--sky-deep);}
  .field input{width:100%;padding:12px 14px;border-radius:12px;border:2px solid #DCE5E9;font-size:1rem;font-family:'Nunito';}
  button{font-family:'Baloo 2',sans-serif;font-weight:700;font-size:1rem;border:none;border-radius:999px;padding:11px 24px;cursor:pointer;background:var(--sun-gold);color:#4A2E00;box-shadow:0 4px 0 #C9852A;}
  button.secondary{background:transparent;color:var(--sky-deep);box-shadow:none;border:2px solid #B9C8CE;}
  .error{color:var(--danger);font-weight:700;margin-top:10px;min-height:1.3em;}
  table{width:100%;border-collapse:collapse;margin-top:12px;font-size:.92rem;}
  th, td{text-align:left;padding:9px 10px;border-bottom:1px solid #E4EBEE;}
  th{color:var(--sky-deep);font-family:'Baloo 2';font-size:.85rem;}
  th.num, td.num{text-align:center;}
  .chdot.done{color:var(--leaf-teal);font-weight:800;}
  .chdot.todo{color:#C7D2D6;}
  .toolbar{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:8px;}
  .toolbar h2{margin:0;color:var(--sky-deep);}
  .loading{text-align:center;color:#6C808A;font-weight:700;padding:30px 0;}
  .scroll{overflow-x:auto;}
  .setup-note{font-size:.8rem;color:#6C808A;margin-top:14px;line-height:1.5;}
</style>
</head>
<body>
<div class="wrap">
  <h1>🦅 Eagle Reading Quest — Teacher Dashboard</h1>
  <div id="app"></div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script>
const CHAPTER_COUNT = 12;
const app = document.getElementById('app');
let allRows = [];

function renderPasscodeGate(errorMsg){
  app.innerHTML = `
    <div class="panel login-panel">
      <h2 style="color:var(--sky-deep);margin-top:0;">Teacher login</h2>
      <div class="field">
        <label for="passInput">Teacher passcode (6+ characters)</label>
        <input id="passInput" type="password" autocomplete="off">
      </div>
      <button id="enterBtn">View class scores</button>
      <div class="error">${errorMsg || ''}</div>
      <p class="setup-note">Set/change the passcode in <code>firebase-config.js</code> (TEACHER_PASSCODE) — see README.md.</p>
    </div>`;
  document.getElementById('enterBtn').addEventListener('click', checkPasscode);
  document.getElementById('passInput').addEventListener('keydown', e => { if(e.key==='Enter') checkPasscode(); });
}

async function checkPasscode(){
  const val = document.getElementById('passInput').value;
  if(val !== TEACHER_PASSCODE){
    renderPasscodeGate('Incorrect passcode.');
    return;
  }
  app.innerHTML = `<div class="loading">Logging in…</div>`;
  try {
    await loadDashboard();
  } catch (e) {
    console.error(e);
    renderPasscodeGate('Could not load scores. Check the Firebase setup in firebase-config.js and Firestore rules.');
  }
}

async function loadDashboard(){
  app.innerHTML = `<div class="loading">Loading class scores…</div>`;
  const snap = await db.collection('scores').get();
  allRows = [];
  snap.forEach(doc => {
    const d = doc.data();
    const chapters = d.chapters || {};
    const row = { name: d.name || '(unnamed)', totalPoints: d.totalPoints || 0, chapters: [] };
    for(let i=1;i<=CHAPTER_COUNT;i++){
      const c = chapters[String(i)];
      row.chapters.push(!!(c && c.answered && c.answered.every(Boolean)));
    }
    allRows.push(row);
  });
  renderTable('points');
}

function renderTable(sortKey){
  const rows = [...allRows];
  if(sortKey === 'name') rows.sort((a,b) => a.name.localeCompare(b.name));
  else rows.sort((a,b) => b.totalPoints - a.totalPoints);

  let chHeaders = '';
  for(let i=1;i<=CHAPTER_COUNT;i++) chHeaders += `<th class="num">${i}</th>`;

  let bodyRows = rows.map(r => {
    let dots = r.chapters.map(done => `<td class="num"><span class="chdot ${done?'done':'todo'}">${done?'✓':'–'}</span></td>`).join('');
    return `<tr><td>${escapeHtml(r.name)}</td><td class="num">${r.totalPoints}</td>${dots}</tr>`;
  }).join('');

  app.innerHTML = `
    <div class="panel">
      <div class="toolbar">
        <h2>${allRows.length} reader${allRows.length===1?'':'s'}</h2>
        <div style="display:flex;gap:8px;">
          <button class="secondary" id="sortName">Sort by name</button>
          <button class="secondary" id="sortPoints">Sort by score</button>
          <button id="exportCsv">Download CSV</button>
          <button class="secondary" id="logoutBtn">Log out</button>
        </div>
      </div>
      <div class="scroll">
        <table>
          <thead><tr><th>Name</th><th class="num">🏆 Score</th>${chHeaders}</tr></thead>
          <tbody>${bodyRows || `<tr><td colspan="${2+CHAPTER_COUNT}">No readers yet.</td></tr>`}</tbody>
        </table>
      </div>
    </div>`;

  document.getElementById('sortName').addEventListener('click', () => renderTable('name'));
  document.getElementById('sortPoints').addEventListener('click', () => renderTable('points'));
  document.getElementById('exportCsv').addEventListener('click', exportCsv);
  document.getElementById('logoutBtn').addEventListener('click', () => { renderPasscodeGate(); });
}

function escapeHtml(s){
  return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function exportCsv(){
  let header = ['Name','Total Score'];
  for(let i=1;i<=CHAPTER_COUNT;i++) header.push(`Chapter ${i} Done`);
  const lines = [header.join(',')];
  allRows.forEach(r => {
    const line = [r.name, r.totalPoints, ...r.chapters.map(d => d ? 'yes' : 'no')];
    lines.push(line.map(v => `"${String(v).replace(/"/g,'""')}"`).join(','));
  });
  const blob = new Blob([lines.join('\n')], {type:'text/csv'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'eagle-reading-quest-scores.csv';
  a.click();
  URL.revokeObjectURL(url);
}

renderPasscodeGate();
</script>
</body>
</html>

const BOOK = {"title": "The Eyes of the Eagle: See the Glory", "chapters": [{"id": 1, "title": "Chapter 1: Spiritual Vision", "text": "<img class=\"chapter-illustration\" src=\"images/ch01/ch01_fig1.jpg\" alt=\"Illustration for Chapter 1\" loading=\"lazy\">\n<p>Among the cliffs and coves where we lived, there were many gulls and all manner of seabirds.</p>\n<p>At dusk, the setting sun would turn the steep rock walls a deep orange-red. Sea winds swept through the trees and shrubs along the cliffs, year after year, never ceasing. Because of this, the trees grew unusually strong. Their trunks and branches bent in the direction of the wind, yet they never fell.</p>\n<p>In the great trees along the cliff's edge, the eagles built their nests. Massive nests were formed from layer upon layer of thick branches, firmly lodged among the high branches of the trees. Inside, the young eaglets were soft and downy, always stretching their open beaks toward the sky and crying out in thin, eager voices, waiting for their parents to return from the sea with food. The father and mother eagles took turns flying out to hunt, then returning to the nest with their catch.</p>\n<p>The bald eagles of our region migrated south when winter came and returned north when summer arrived. To us, the earth and sea were a home that stretched far before us.</p>\n<hr class=\"scene-break\">\n<p>That summer, I was no longer a young eaglet. White feathers had begun to appear upon my head, and my talons had grown stronger than before. I loved climbing into the highest places and looking down upon the land and sea. I loved watching everything that was happening below.</p>\n<p>Sometimes I would see a great blue whale break through the surface of the sea, sending a plume of warm breath high into the air through its enormous blowhole. The schools of fish nearby would scatter in alarm, some of them leaping from the water. Gulls, Arctic terns, albatrosses, storm petrels, and other seabirds were often drawn to the commotion caused by these great creatures. We would circle above them, chasing the wind, chasing the waves, and chasing one another.</p>\n<img class=\"chapter-illustration\" src=\"images/ch01/ch01_fig2.jpg\" alt=\"Illustration for Chapter 1\" loading=\"lazy\">\n<p>When the sun went down, we would each return to our nests upon the cliffs. The rock walls would bathe in the last glow of evening, while the blue whales disappeared once more into the depths of the sea.</p>\n<p>In those days, there was one thing I loved more than anything else: flying.</p>\n<p>We eagles have extraordinarily keen eyes. From high above, I could see rabbits running across the ground, little squirrels darting among the trees, and even snakes hiding in the grass. Our sight was sharper than that of many other creatures, and diving from the sky to seize our prey was a skill that came to us almost as naturally as flight itself.</p>\n<p>But there was one thing I could never seem to do well.</p>\n<p>It was <strong>catching fish.</strong></p>\n<p>Fish moved beneath the glittering surface of the water. Sunlight pierced the waves, and their shapes appeared and disappeared among the shifting reflections. Whenever I thought I had fixed my eyes upon the right one, I would dive, stretch out my talons\u2014and the fish would already be somewhere else.</p>\n<p>Again and again, I failed.</p>\n<hr class=\"scene-break\">\n<p>The eyes of an eagle may see far, but that does not mean an eagle always sees a fish clearly beneath the water. In those days, I was still learning.</p>\n<p>One afternoon, the heat was heavy, and almost no wind stirred the air. I had spent the entire day practicing. I watched the surface of the sea and dove again and again; again and again I stretched out my talons; again and again I grasped nothing but water.</p>\n<p>At last, I was exhausted.</p>\n<p>I settled onto a branch, breathing heavily, and stared out over the sea.</p>\n<p>That was when I noticed a group of golden eagles resting on the other side of the cliffs. They were preparing to continue their migration south.</p>\n<p>Leading them was an old golden eagle.</p>\n<p>He was quiet and watchful, a bird who spoke very little.</p>\n<p>But before long, I realized that he was watching me.</p>\n<p>After a while, he spoke.</p>\n<p>\u201cYou must learn to look upward.\u201d</p>\n<p>\u201cWhat?\u201d I lifted my head.</p>\n<p>He did not answer my question. Instead, he said,</p>\n<p>\u201cTry looking upward. You will see farther, and you will see more clearly.\u201d</p>\n<p>\u201cI already know that. My parents taught me from the time I was young to keep watch over everything around me.\u201d</p>\n<p>I spoke with a touch of impatience.</p>\n<p>The golden eagle did not argue. He simply raised his head and gazed into the distance. Then he pointed with his beak.</p>\n<p>\u201cLook at that little island.\u201d</p>\n<p>I followed his gaze.</p>\n<p>The island was far away. A gull stood upon the rocks, a snake hanging from its beak. The snake was still flicking its tongue.</p>\n<p>I was surprised. It was so far away, yet I could see it.</p>\n<p>The golden eagle said,</p>\n<p>\u201cDo not look at the world with the light behind you. Learn to see the world through the light.\u201d</p>\n<p>I looked at him.</p>\n<p>\u201cThrough the light?\u201d</p>\n<p>\u201cYes.\u201d He paused, then continued. \u201cWhen you used to watch the fish, you paid attention only to where it was.\u201d</p>\n<p>He turned his gaze toward the sea.</p>\n<p>\u201cBut the fish will not wait there for you.\u201d</p>\n<p>\u201cWhen you begin your dive, the fish is still moving. You must watch the direction in which it is swimming and judge its speed. You must see, in your mind, where it will be before it arrives there.\u201d</p>\n<p>Slowly, I began to understand.</p>\n<p>He continued: \u201cWhen you finally extend your talons, it is not enough to see where the fish is. You must know where it is going.\u201d</p>\n<p>\u201cBut how can I know where it will go?\u201d I asked.</p>\n<p>\u201cYou must observe,\u201d he replied.</p>\n<p>\u201cWatch how it swims. Watch how the current moves. Watch the direction it takes among the waves. You are not merely watching where it is. You are watching where it is going.\u201d</p>\n<p>Then he added, \u201cTrue vision is not merely seeing a thing.\u201d He paused. \u201cIt is seeing what is happening within it.\u201d</p>\n<p>I remembered those words.</p>\n<p>I flew toward the sea again. This time, I did not dive immediately.</p>\n<p>First, I watched. The fish swam to the left, paused, and then turned forward. I began to notice the rhythm of its movement, the speed at which it traveled.</p>\n<p>Then I opened my wings. I dove. The sea wind rushed through my feathers. The fish was still moving. I adjusted my course and descended farther. I stretched out my talons. And in that instant, I caught it.</p>\n<img class=\"chapter-illustration\" src=\"images/ch01/ch01_fig3.jpg\" alt=\"Illustration for Chapter 1\" loading=\"lazy\">\n<p>For the first time, I truly caught a fish.</p>\n<p>I flew back to the branch. Only then did I understand that seeing and understanding are two different things.</p>\n<p>I was full. But more important than a full stomach was a joy I had never known before.</p>\n<p>I looked toward the old golden eagle. I began to understand that he was more than a fellow traveler on the migration.</p>\n<p>He was a teacher.</p>\n<hr class=\"scene-break\">\n<p>The next day, I encountered something else. A fox was chasing a mother mouse and her two little ones.</p>\n<p>I watched from above. The fox was large. The mother mouse was small. The two little mice were smaller still. I quickly realized that if I could not catch the fox, the two little mice would be easy prey. I was preparing to dive when the golden eagle stopped me.</p>\n<p>\u201cAre you going to catch those two little mice?\u201d</p>\n<p>\u201cOf course.\u201d I did not understand. \u201cWhy not?\u201d</p>\n<p>He said, \u201cHave you not seen?\u201d</p>\n<p>I looked down again. \u201cSeen what?\u201d</p>\n<p>\u201cThe mother mouse.\u201d</p>\n<p>I saw her. She was standing between the fox and her young.</p>\n<p>The golden eagle said, \u201cShe knows she may die, yet she still stands between them and danger.\u201d</p>\n<p>I fell silent.</p>\n<p>\u201cShe is willing to give her life to protect her children.\u201d</p>\n<p>After a while, the golden eagle asked, \u201cDo you remember what I taught you yesterday?\u201d</p>\n<p>I knew what he meant.</p>\n<p>\u201cLook upward?\u201d</p>\n<p>\u201cYes.\u201d</p>\n<p>I was unconvinced. \u201cBut what does that have to do with the mice?\u201d</p>\n<p>The golden eagle did not rebuke me. He simply said, \u201cWhen you look at anything, do not look only at what is on the surface.\u201d</p>\n<p>He lifted his head toward the sky. \u201cLearn to see through the light.\u201d</p>\n<p>For me, this was far more difficult than catching fish. I did not know how to do it.</p>\n<p>I followed his instruction. I shifted my position so that the sunlight fell from above, and then I looked down again.</p>\n<p>The fox. The mother mouse. The two little mice.</p>\n<p>At first, I saw nothing different. But the other golden eagles were watching me in silence. It seemed they were waiting for me to see something I had not seen before.</p>\n<p>So I tried again. I lifted my eyes toward the sky and watched the sunlight. Then, following the light, I looked down toward the earth.</p>\n<p>And in that moment, I suddenly saw things I had never seen before.</p>\n<p>Above the fox's head hung a small cloud of darkness.</p>\n<p>Above the mother mouse was a small white cloud.</p>\n<p>The white cloud was soft and pure, like a tuft of cotton illuminated by the sun. But the cloud above the fox seemed dark and heavy, as though it concealed something hidden and evil.</p>\n<p>For the first time, I understood that the same world is not seen in the same way by every pair of eyes. Before that day, I had known only how to look with my eyes. Now, it seemed that I had begun to glimpse another world.</p>\n<p>The golden eagle looked at me. He knew that I had seen it. He did not explain. Instead, he asked,</p>\n<p>\u201cWhat do you see?\u201d</p>\n<p>I thought for a moment. \u201cI see <strong>black clouds</strong> and <strong>white clouds</strong> above their heads. The one who is good has a white cloud.\u201d</p>\n<p>The golden eagle nodded. \u201cGood.\u201d</p>\n<p>I looked at him. \u201cWhat is good?\u201d</p>\n<p>But he did not answer. He simply looked again at the mother mouse. \u201cSome things cannot be seen with the eyes alone.\u201d</p>\n<p>I did not fully understand. But I remembered his words.</p>\n<p>Just then, one of the golden eagles suddenly took flight. From high above, he plunged toward the earth and carried the fox away. The mother mouse immediately led her two little ones back into their hole.</p>\n<img class=\"chapter-illustration\" src=\"images/ch01/ch01_fig4.jpg\" alt=\"Illustration for Chapter 1\" loading=\"lazy\">\n<p>After that day, I began to watch more carefully. I practiced what the golden eagle had called \u201cseeing through the light.\u201d I watched the sky, the sea, the wind, the trees, the animals\u2014and people. Gradually, I began to notice something strange. Above some creatures, there seemed to be a small cloud of white. It was soft and pure, like cotton touched by sunlight. Above others, there seemed to gather a dark cloud, gray and heavy.</p>\n<p>Whenever I saw a white cloud or a dark one, I remembered the words of my teacher: \u201cLearn to see through the light above.\u201d</p>\n<p>Several days later, I could no longer keep my question to myself. \u201cTeacher, will I always have this kind of vision?\u201d</p>\n<p>He was silent for a while. Then he answered,</p>\n<p>\u201cNot necessarily.\u201d</p>\n<p>I was surprised. \u201cWhy?\u201d</p>\n<p>He said, \u201cBecause eyes grow tired, and the heart can grow dull.\u201d</p>\n<p>I became quiet.</p>\n<p>\u201cIf you depend only upon your own eyes, one day you will begin to see only the surface again.\u201d He continued: \u201cYou must keep looking upward. See through the light.\u201d</p>\n<p>I wanted to ask him more. But he said nothing further. He simply gazed into the distance. After a while, he spoke slowly.</p>\n<p>\u201cNot every eagle will see the world in the same way.\u201d</p>\n<p>I looked up at him. \u201cThen why was I allowed to see?\u201d</p>\n<p>He did not answer me directly. Instead, he said, \u201cWe were all fashioned by the hand of the Creator. He gives each eagle different wings, and He gives each eagle a different path.\u201d</p>\n<p>I asked, \u201cThen what am I supposed to do?\u201d</p>\n<p>He looked toward the horizon. \u201cWhen you truly understand what you have been given to see, you will know.\u201d</p>\n<p>This time, I did not ask another question. I knew that some answers are not meant to be known until their appointed time.</p>\n<p>That evening, I flew higher than I had ever flown before. The sky was clearer than usual. The sun was sinking in the west. Golden light fell across the sea like a road stretching into the distance.</p>\n<p>I suddenly remembered the words of my teacher:</p>\n<p>\u201cLearn to see the world through the light.\u201d</p>\n<p>I gazed upon that light. And for the first time, I wondered if he had never really been teaching me how to catch fish at all. Perhaps he had been teaching me another way of seeing the world.</p>\n<p>A few days later, the golden eagles prepared to continue their migration south. My heart was filled with things I wanted to say to my teacher.</p>\n<p>I wanted to tell him what I had learned.</p>\n<p>I wanted to tell him that he had changed the way I saw.</p>\n<p>But in the end, I could not say any of it. I only wished that he would stay. Yet the golden eagles began to spread their wings, one after another. They flew south. I stood upon the cliff and watched them grow smaller and smaller. Their forms gradually faded into tiny dark specks. Then, even those specks disappeared beyond the distant horizon.</p>\n<p>My teacher was truly gone. The wind came sweeping in from the sea. I stood there for a long time without moving. And then I remembered everything he had left with me.</p>\n<p>Look upward.</p>\n<p>See the light.</p>\n<p>See the world through the light.</p>\n<p>I knew that I had been given eyes to see something I had never seen before. I gazed toward the place where the golden eagle had disappeared. For a long while, I said nothing. Then, facing the distant sky, I called out with all my strength:</p>\n<blockquote><strong>\u201cYes. I will remember.\u201d</strong></blockquote>", "questions": [{"level": 1, "prompt": "What is the one skill the young eagle could never do well at the start of the chapter?", "choices": ["Building a nest", "Flying at night", "Catching fish", "Migrating south"], "correct": 2}, {"level": 2, "prompt": "When the golden eagle says, \u201cDo not look at the world with the light behind you. Learn to see the world through the light,\u201d what is he really telling the young eagle to do?", "choices": ["Fly only in the morning", "Look past the surface and pay attention to what is really happening, not just where something is", "Avoid looking at the sun", "Never trust his own eyes again"], "correct": 1}, {"level": 3, "prompt": "By the end of the chapter, the young eagle can see white clouds above the mother mouse and a dark cloud above the fox. What big idea does this teach about \u201ctrue vision\u201d?", "choices": ["Animals with light-colored fur are always kind", "True vision means noticing size and color only", "True vision looks beyond the surface to see the good or evil in a heart, which ordinary eyes cannot do", "The golden eagle can see the future"], "correct": 2}]}, {"id": 2, "title": "Chapter 2: He Called My Name", "text": "<img class=\"chapter-illustration\" src=\"images/ch02/ch02_fig1.jpg\" alt=\"Illustration for Chapter 2\" loading=\"lazy\">\n<p>Ever since the golden eagle had taught me how to see, I had grown even more eager to look upon the world through the light. I was no longer satisfied with watching only the sky, the sea, the forests, and the valleys. I began to pay attention to every living thing. Especially human beings.</p>\n<p>My teacher had told me that human beings were creatures whom the Creator regarded with special care. So I began to watch them more closely.</p>\n<p>Of all the living creatures upon the earth, human beings seemed to have the greatest power to change the world around them. We often saw them from high above. They built houses, cultivated fields, tended flocks, and carved roads through valleys and along rivers. They could even pile stones into walls and shape wood into boats that carried them to places far beyond our sight.</p>\n<p>Yet we eagles never dared to come too close to them. My parents had once told me that human beings were made by the Creator in His own image.</p>\n<p>I gradually discovered that human beings truly were different from the rest of creation. They could think. They could love one another, and they could hurt one another. They could rejoice over things they could not see, and they could worry about things that had not yet happened. Sometimes peace rested upon their faces. At other times, deep fear seemed to hide within their eyes.</p>\n<p>When I looked at people through the light, I could see white clouds or dark clouds above their heads. Above some people hung clouds that were pure and gentle. Sunlight passed through them, making their faces appear peaceful and bright. Above others gathered heavy clouds of darkness. These were not clouds in the sky. They did not drift away with the wind, nor could sunlight scatter them. And human beings themselves could not see the clouds above their own heads.</p>\n<p>Those who carried white clouds seemed gentler, and I was not afraid to come near them. But those who carried dark clouds seemed to have their fear, anxiety, jealousy, and even resentment written across their faces. I kept my distance from them.</p>\n<p>All of this made me believe even more strongly that we had not come into this world by accident. The mountains had their order. The sea had its boundaries. Birds knew how to fly. Fish knew how to move through the depths of the water. A seed fell into the earth and somehow knew to grow toward the light. I did not know how the Creator had made all these things. Yet behind everything I saw, there seemed to be a pair of eyes. Behind every living thing, there seemed to be a Creator. And so, when I looked upon the world, I no longer saw only what had been created. Through the things He had made, I began to search for the Creator whom I could not see.</p>\n<hr class=\"scene-break\">\n<p>Then, one day, I saw my Master for the first time. That was the first time I discovered that there was a kind of light I had never seen before. There was light upon Him. But it was not the light of the sun falling upon Him. When sunlight falls upon a person, it changes as the person moves.</p>\n<p>But there was light upon Him. Even when He walked among the crowd, I could still see it. Even when He entered the forest, the light remained. I had spent so long learning to see through the light. But that day, for the first time, I saw One who seemed to carry the light within Himself.</p>\n<p>That day, He was teaching a crowd of people. Only later did I learn His name.</p>\n<p>Jesus.</p>\n<p>I was perched on a tall tree at the edge of the forest. Beyond the trees lay a broad valley filled with villages, fields, and pasturelands where shepherds tended their flocks. A gentle breeze came through. I spread my wings and left the treetop, circling above the valley. The wind passed beneath my wings, and all I had to do was let it carry me. From that height, the people below seemed very small.</p>\n<p>A great crowd had gathered from every direction. Farmers, shepherds, women, children, and many others whose names I did not know sat upon the hillside around Jesus. He wore clothing much like the others. There was nothing about Him that seemed outwardly remarkable.</p>\n<p>Yet whenever Jesus spoke, the crowd became quiet. His words seemed to flow from somewhere deep within Him, as though they had never been taught to Him by anyone else.</p>\n<p>It was then that I noticed a man. A few days earlier, I had flown over his barn. Around it, I had seen many lizards and frogs.</p>\n<p>He had the largest barn in the village. I guessed that he must have been the richest man there. Inside his barn were carts, farming tools, and equipment for grinding grain. I had often watched him carry one heavy sack of grain after another into the barn, only to come back out and carry in more.</p>\n<p>Whenever he set down a heavy sack, he did so slowly. He looked as though those grains had been weighing upon him for many years. Even when he sat down to rest, I could almost imagine the weight still hanging from his shoulders. His brow was always furrowed. He would look at his full barn, then at his vast fields, and finally into the distance. It was as though there were always something he could not stop worrying about.</p>\n<p>That day, I saw him again. He was standing beside the field, talking with another man. They looked out over the fields that had already been harvested.</p>\n<p>\u201cThe harvest is good this year,\u201d the other man said.</p>\n<p>He nodded, but he did not smile. \u201cYes.\u201d</p>\n<p>\u201cYour barns are already full.\u201d He crouched down, picked up a handful of earth, and slowly crushed it between his fingers.</p>\n<p>\u201cBut I am worried about next year.\u201d He looked across his fields and was silent for a moment.</p>\n<p>\u201cThis year has been good. But what about next year?\u201d</p>\n<p>\u201cWill everything I have now really be enough to last me?\u201d He lowered his head and looked at the soil in his hand.</p>\n<p>\u201cI just want to make sure I will never be in want.\u201d</p>\n<p>\u201cYou already have plenty,\u201d someone said.</p>\n<p>But he shook his head. \u201cNot enough.\u201d</p>\n<img class=\"chapter-illustration\" src=\"images/ch02/ch02_fig2.jpg\" alt=\"Illustration for Chapter 2\" loading=\"lazy\">\n<hr class=\"scene-break\">\n<p>Jesus began speaking about me, flying in the sky.</p>\n<p>\u201cLook at the birds of the air. They do not sow or reap or store grain in barns.\u201d</p>\n<p>\u201cYet your heavenly Father feeds them. Are you not much more valuable than they?\u201d</p>\n<p>Jesus lifted His head. He stretched out His hand and pointed toward me as I circled high above the valley. The crowd followed His gesture. One pair of eyes after another turned toward me. I had never been watched by so many people at once. I did not know where I was supposed to fly, so I simply continued circling through the sky.</p>\n<p>And then, in that moment, His eyes met mine. For an instant, all I could see was Jesus and the hand He had raised toward me. The way He looked at me was nothing like the way hunters looked at us.</p>\n<p>And suddenly, I understood what He had just said.</p>\n<p>\u201cYour heavenly Father feeds them.\u201d</p>\n<p>I was one of those birds He was talking about. And that heavenly Father was watching over me. Jesus continued speaking to them:</p>\n<p>\u201cCan any one of you by worrying add a single hour to your life?\u201d</p>\n<p>The man with the furrowed brow lowered his head. He said nothing more.</p>\n<p>Then Jesus began speaking about the flowers of the field. He told the people to look at the flowers scattered across the valley.</p>\n<p>\u201cConsider how the wildflowers grow. They do not labor or spin.\u201d</p>\n<p>I followed His gaze. The valley was filled with flowers. When the wind moved through them, they swayed gently beneath the brilliant sunlight.</p>\n<p>\u201cYet I tell you, not even Solomon in all his splendor was dressed like one of these,\u201d Jesus said.</p>\n<p>The man slowly lifted his head. One of his companions leaned toward him and whispered, \u201cHe is right.\u201d</p>\n<p>Another man, who knew him well and knew how often he worried, said, \u201cThe crops have not even been planted, and you are already worrying about the harvest.\u201d</p>\n<p>The man did not answer. He simply looked at the flowers in the valley. The furrows in his brow seemed to loosen. Perhaps, for the first time, he realized that while he had been busy preparing for tomorrow, he had never truly stopped to look at the flowers of today.</p>\n<p>At last Jesus said, \u201cIf that is how God clothes the grass of the field, which is here today and tomorrow is thrown into the fire, will He not much more clothe you\u2014you of little faith?\u201d</p>\n<p>The man drew a deep breath. And then, to my surprise, he smiled. He stood and lifted his face toward the sky. The wind moved through his hair. His shoulders slowly straightened. Whatever had been pressing upon him for so long seemed to loosen its grip. It was like dry earth after a long drought, when green shoots finally begin to break through the soil. A smile slowly spread across his face. Then he opened his arms and cried out toward the sky in joy.</p>\n<hr class=\"scene-break\">\n<p>Jesus continued speaking, telling one remarkable story after another. The people sat upon the hillside listening through the afternoon, as though His teaching had only just begun. Even I had forgotten how long I had been flying above Him.</p>\n<p>Then Jesus began speaking about sheep. I especially liked listening when Jesus talked about sheep, because I had flown over many shepherds' sheepfolds. Some sheepfolds were enclosed by low walls made of stones, with only one narrow entrance.</p>\n<p>At night, the shepherds would lead the sheep inside. The sheep would huddle together. And the shepherd would remain near the entrance. During the night, wolves would howl in the distance. Their cries echoed through the valleys. Sometimes foxes would come near as well. I had seen shepherds take up their staffs and drive away wolves that came too close to the flock. On some nights, the shepherd hardly slept at all. Even when dawn came, he remained beside the sheep.</p>\n<p>Jesus said that a shepherd knows his sheep. And the sheep know the voice of their shepherd.</p>\n<img class=\"chapter-illustration\" src=\"images/ch02/ch02_fig3.jpg\" alt=\"Illustration for Chapter 2\" loading=\"lazy\">\n<p>Strangely, whenever Jesus spoke about sheep, I felt that He was speaking about something more than sheep. It seemed that He was speaking about these people.</p>\n<p>Every time Jesus spoke a word, I seemed to see tiny seeds of light falling from His mouth. They were seeds of light that, as far as I could tell, only I could see.</p>\n<p>They drifted toward the crowd. Some fell into people's hearts. And when they fell, the darkness above those people slowly began to brighten. Places that had once been dim began to glow. Some listened intently. I saw the seeds enter their hearts, as though tiny sparks had begun to shine within dark soil.</p>\n<p>But I also saw seeds fall beside some people. They paid no attention. They were too busy talking among themselves. Or arguing with one another. Some simply got up and walked away, returning to their villages and their ordinary work. Those seeds of light fell upon the ground. And soon, their light faded away.</p>\n<p>I had never seen light like that anywhere else. Only the words that came from His mouth carried such light. I could not help but wonder:</p>\n<p>\u201cWhy do His words carry light?\u201d</p>", "questions": [{"level": 1, "prompt": "What did the young eagle notice above people's heads when he looked at them \u201cthrough the light\u201d?", "choices": ["Golden crowns", "White clouds or dark clouds", "Rainbows", "Nothing at all"], "correct": 1}, {"level": 2, "prompt": "Why did the rich man with the full barns keep worrying, even though he already had plenty?", "choices": ["He was afraid a storm would destroy his barn", "He wanted to be sure he would never run out, no matter how much he already had", "He owed money to his neighbors", "He didn't like farming"], "correct": 1}, {"level": 3, "prompt": "Jesus says the birds don't store grain in barns, yet God feeds them. What lesson was this meant to teach the worried rich man?", "choices": ["Birds are smarter than people", "Storing food is always wrong", "Worrying about the future can't add a single hour to your life, so trust should replace fear", "Farmers should give away all their grain"], "correct": 2}]}, {"id": 3, "title": "Chapter 3: The Story of Centurion", "text": "<img class=\"chapter-illustration\" src=\"images/ch03/ch03_fig1.jpg\" alt=\"Illustration for Chapter 3\" loading=\"lazy\">\n<p>At the edge of the forest was the same valley I had seen the day before. I circled above it and recognized the familiar figure at once.</p>\n<p>It was my Master.</p>\n<p>I saw people gathering slowly from every direction. Some came down from the hills; others hurried along the narrow paths that wound through the valley. The valley, which had been so quiet the day before, was once again filling with the sound of human voices.</p>\n<p>That day, I noticed several Roman soldiers patrolling in the distance. They stopped and watched the crowd from afar.</p>\n<p>I saw their leader.</p>\n<p>I heard the others call him \u201cCenturion.\u201d</p>\n<p>So I assumed that was his name. He was not an ordinary soldier. He commanded a large company of men\u2014perhaps a hundred or so.</p>\n<p>We bald eagles often saw Roman soldiers. They marched from one town to another, their helmets and shields flashing beneath the sunlight. Centurion had joined the army when he was young. He had risen from an ordinary soldier to become an officer.</p>\n<p>That day, he had been accompanying his soldiers on patrol. But when he heard the voice of Jesus, he gradually came to a stop. He stood at the edge of the crowd and said nothing.</p>\n<p>He simply listened.</p>\n<p>At first, his face still carried the expression of an officer on duty. From time to time, he glanced at the crowd and then back at Jesus, as though trying to determine what kind of man this teacher really was.</p>\n<p>But after a while, his eyes no longer left Jesus. He listened carefully to every word. Sometimes his brow tightened. Sometimes he lowered his head in thought. Eventually, he even stepped forward a few paces, simply so that he could hear more clearly.</p>\n<p>The soldiers standing beside him noticed. But they did not think it strange. Several of them talked among themselves, occasionally looking toward the crowd and then toward their commander. Only Centurion grew quieter and quieter. He was listening to a story unlike any he had ever heard.</p>\n<p>And he began to realize that the words of Jesus were not merely being spoken to the crowd. They were entering his heart.</p>\n<img class=\"chapter-illustration\" src=\"images/ch03/ch03_fig2.jpg\" alt=\"Illustration for Chapter 3\" loading=\"lazy\">\n<p>Centurion believed that there must be a supreme ruler over heaven and earth. He understood this because of the army. In the army, commands passed from one rank to another. Every soldier knew whom he was expected to obey and who had the authority to give him orders. A great army could have many soldiers, many officers, and many commanders. But in the end, everyone answered to a higher authority. So Centurion believed there was a God who had created heaven and earth and who ruled over all things.</p>\n<p>But when Jesus began speaking of a \u201cFather,\u201d something in Centurion's heart was stirred.</p>\n<p>He could understand a supreme God. He could understand a ruler who governed heaven and earth. But the thought that the Creator could become a Father to His creatures was something entirely different.</p>\n<p>Jesus began telling the story of a prodigal son. A younger son left his father, squandered his inheritance, and eventually became so poor that he could do nothing but feed pigs in the fields. When he had nowhere else to turn, he remembered his father and decided to go home. While he was still a long way off, his father saw him. The father ran to him, embraced him, and kissed him again and again. He did not begin by demanding an account of his son's failures. Instead, he ordered his servants to bring the finest robe and put it on him, to place a ring on his finger, and to prepare a feast. \u201cFor this son of mine was dead and is alive again; he was lost and is found.\u201d Centurion listened to the story without speaking for a long time.</p>\n<p>The story touched something deep within him. He lowered his head, his eyes fixed upon the ground. He had left home when he was young. In the army, he had learned discipline and obedience. He had also learned how to make others obey him. He could understand a king. He could understand a supreme commander.</p>\n<p>But he could not understand a father.</p>\n<p>He spoke quietly to himself: \u201cA great army can have many officers, but only one supreme commander. So God must be that supreme commander.\u201d</p>\n<p>Yet another voice within him tried to pull him back toward reality. \u201cLife is simply harsh and practical.\u201d \u201cDo not be so naive.\u201d As for the prodigal son in the story, Centurion thought the man was nothing more than an ungrateful fool.</p>\n<p>And yet, at the same time, he understood exactly what Jesus was saying. The father's great compassion toward his son struck something deep within him.</p>\n<p>Suddenly, Centurion remembered something that had happened many years before. He had been only a young soldier then. One day, he stole money from another soldier and was caught. He was severely punished and nearly lost his place in the army. His military instructor rebuked him harshly. But in the end, that same instructor took money from his own savings and paid the debt for him.</p>\n<p>It was the first time Centurion had truly experienced kindness and mercy. He had carried that memory quietly within him ever since. And now, the story Jesus told had brought it back.</p>\n<p>Over the years, Centurion had begun to feel that his heart was like barren soil, hardened and parched beneath the wind. Outwardly, it remained. But inwardly, it had become dry. He had become a slave to life itself. When he was young, he had been an ambitious adventurer. Now he was little more than a weary wanderer. He had forgotten that, deep within him, he had once longed for the warmth of a father's embrace.</p>\n<p>But now, the heavenly Father Jesus spoke of awakened that long-forgotten longing. If such a Father truly existed, how should he respond?</p>\n<p>He told his doubts to Titus, who was standing beside him. But Titus was not moved by what he heard. Instead, he firmly rejected the message of Jesus.</p>\n<p>\u201cI will never believe it,\u201d he said.</p>\n<p>\u201cMy father abandoned me when I was very young. That is why I joined the army. I hate him.\u201d</p>\n<p>Centurion understood Titus. Because that kind of pain was real. He did not blame him.</p>\n<p>Centurion said, \u201cI think there are many kinds of fathers on earth. But the Father in heaven is different. He is perfect.\u201d</p>\n<p>\u201cPerhaps we must first know that perfect Father in heaven before we can truly understand what an earthly father ought to be.\u201d</p>\n<p>Titus still could not accept it.</p>\n<p>Centurion did not argue with him. He simply said to himself, \u201cJust because I have never experienced something does not mean it does not exist.\u201d</p>\n<p>\u201cThere are many things that can be learned.\u201d And then, once again, he told himself, \u201cI can learn.\u201d</p>\n<p>He had always been a disciplined man. So he decided to follow the prayer Jesus had taught. That day, he stepped aside, lowered his head, and knelt upon the ground.</p>\n<p>For the first time, he tried to speak to his Father in heaven. With reverence, he recited the prayer Jesus had taught His disciples. From a distance, some of the people saw the Roman officer kneeling. Some assumed he was reporting something to a superior.</p>\n<p>But Centurion felt something changing within him. To become a child of the heavenly Father was an identity that gave him a dignity he had never known. It was a dignity that none of his achievements could ever give him.</p>\n<p>For the first time, he understood that a person's worth does not come from rank, military victories, or the approval of a general. It comes from knowing whose child he is. The dignity he had spent his whole life pursuing was nothing compared with the dignity of being a son.</p>\n<p>He rose to his feet and looked up at the eagle circling in the sky.</p>\n<p>I saw his face. There was a steadiness in his expression, a quiet strength, almost the bearing of a prince. I do not know how the human heart changes. But I knew that the man before me was no longer the man I had watched before. In the days that followed, his soldiers began to say that he was less difficult to be around. He had become gentler. More approachable.</p>\n<p>I watched him recite the Lord's Prayer each day:</p>\n<p>\u201cOur Father which art in heaven,</p>\n<p>Hallowed be Thy name.</p>\n<p>Thy kingdom come.</p>\n<p>Thy will be done in earth, as it is in heaven.</p>\n<p>Give us this day our daily bread.</p>\n<p>And forgive us our debts, as we forgive our debtors.</p>\n<p>And lead us not into temptation,</p>\n<p>but deliver us from evil.</p>\n<p>For Thine is the kingdom,</p>\n<p>and the power,</p>\n<p>and the glory,</p>\n<p>for ever.</p>\n<p>Amen.\u201d</p>\n<img class=\"chapter-illustration\" src=\"images/ch03/ch03_fig3.jpg\" alt=\"Illustration for Chapter 3\" loading=\"lazy\">", "questions": [{"level": 1, "prompt": "What was the job or role of the man the others called \u201cCenturion\u201d?", "choices": ["A shepherd", "A commander of Roman soldiers", "A fisherman", "A schoolteacher"], "correct": 1}, {"level": 2, "prompt": "Why did the story of the prodigal son affect Centurion so deeply?", "choices": ["He had also once run away from home to sea", "He had never heard a story before", "It reminded him of a longing for a father's forgiveness and love that he had buried inside himself", "He didn't understand the story at all"], "correct": 2}, {"level": 3, "prompt": "Centurion tells Titus, \u201cJust because I have never experienced something does not mean it does not exist.\u201d What does this show about how Centurion is changing?", "choices": ["He is becoming more stubborn", "He is willing to stay open to something he cannot yet fully explain, instead of dismissing it", "He no longer respects his commanding officers", "He has decided to leave the army immediately"], "correct": 1}]}, {"id": 4, "title": "Chapter 4: A Little Boy's Lunch Bag", "text": "<img class=\"chapter-illustration\" src=\"images/ch04/ch04_fig1.jpg\" alt=\"Illustration for Chapter 4\" loading=\"lazy\">\n<p>People loved listening to my Master tell stories. They always wanted Him to say more. But happy moments always seem to pass the fastest. Before we knew it, the setting sun had painted the horizon orange-red, and the evening sky had begun to glow.</p>\n<p>My Master asked the disciples beside Him what they should give the crowd to eat. Some of them answered that even if they sent everyone home to find food, it would take a long time for the entire crowd to disperse. The disciples began asking whether anyone among the people had brought food. Very few had.</p>\n<p>Then a little boy stepped forward, carrying his own small lunch bag. His mother had prepared it for him. Inside were five small loaves of bread and two fish.</p>\n<p>I almost wanted to swoop down and stop him, because he clearly had no idea how many people were there. From high above, I could see them covering the hills and filling the valley.</p>\n<p>\u201cHow could so little food possibly feed so many people?\u201d</p>\n<p>Yet the boy's simple offering seemed to please my Master greatly. My Master took his lunch bag. He gave thanks, then broke the loaves and divided the fish, handing them to His disciples. The disciples began distributing the food among the people.</p>\n<p>I expected them to run out almost immediately. But the food kept moving. One portion after another. One pair of hands after another. From the hands of the disciples into the hands of the crowd.</p>\n<p>I circled above the hillside, watching. Some people stared in amazement at the food in their hands. Others simply lowered their heads and ate quietly. The fragrance of warm bread and fish spread across the hillside.</p>\n<p>Before long, everyone had eaten their fill. The children got up and gathered together to play. The adults sat in small groups, watching the last light of the setting sun fade in the west.</p>\n<p>Still, I did not understand. There had been only five loaves and two fish. How could there possibly have been enough for so many?</p>\n<p>My Master did not hurry away. Instead, He told the disciples to gather the remaining pieces so that nothing would be wasted.</p>\n<p>The disciples moved through the crowd, gathering what was left, one piece at a time.</p>\n<p>I watched from above. One basket. Then another. And another. Until, at last, they had filled twelve baskets.</p>\n<p>My eyes widened. Five loaves. Two fish. Such a small amount of food had fed so many people\u2014and twelve baskets were still left over.</p>\n<hr class=\"scene-break\">\n<p>My Master often prayed alone in the early morning. Sometimes in the forest. Sometimes on a mountain. Only after He had finished praying would He go with His disciples into one village after another.</p>\n<p>He seemed very happy living among human beings. He told them stories. He healed them. He stayed with them. But He was also often sorrowful because of them.</p>\n<p>I heard Him praying for those people. Sometimes I could not understand why He prayed. From where I watched, it seemed that nothing changed immediately after He prayed. The people still argued. The sick still needed healing. Those who opposed Him still came looking for Him.</p>\n<p>Yet, little by little, I began to notice something strange. After my Master prayed, He Himself seemed different. He became quieter. More steadfast. More courageous. He was able to face each new day. Even when people accused Him harshly, He did not turn away.</p>\n<p>And I began to understand one thing: Everything my Master did seemed to begin with those quiet moments of prayer. And so I began to wonder:</p>\n<p>What would human beings do to my Master next?</p>", "questions": [{"level": 1, "prompt": "What food did the little boy bring in his lunch bag?", "choices": ["Five loaves and two fish", "Two loaves and five fish", "A basket of fruit", "Bread and honey"], "correct": 0}, {"level": 2, "prompt": "Why did the eagle almost want to \u201cswoop down and stop\u201d the boy from giving away his lunch?", "choices": ["The eagle was hungry and wanted the food itself", "The eagle assumed such a small amount of food could not possibly feed such a huge crowd", "The boy looked lost", "The disciples told the eagle to stop him"], "correct": 1}, {"level": 3, "prompt": "Twelve baskets of food were left over after everyone ate. What does this detail suggest about the story's message?", "choices": ["The crowd didn't eat very much", "Jesus can take something small offered in faith and make it more than enough", "The boy actually brought much more food than described", "The leftover food was thrown away"], "correct": 1}]}, {"id": 5, "title": "Chapter 5: The Wind and the Sea Were Still", "text": "<img class=\"chapter-illustration\" src=\"images/ch05/ch05_fig1.jpg\" alt=\"Illustration for Chapter 5\" loading=\"lazy\">\n<p>My Master and His disciples got into a boat to travel to another village. That day, the wind and the waves had a little quarrel.</p>\n<p>They seemed to be arguing over a question that mattered greatly to them: Who was moving the clouds across the sky\u2014the wind or the waves? Perhaps the afternoon had been too quiet and they were simply bored. The wind blew again and again from the mountaintops toward the sea, while the waves refused to be outdone. One wave after another rose up and rushed toward the wind.</p>\n<p>My eagle companions came flying over as well. We spread our wings and soared above the wind and the waves.</p>\n<p>But gradually, the sky began to change. The bright sky slowly disappeared beneath the clouds. The golden light of the setting sun faded little by little. The sky turned gray. Then dark gray. In the distance, the clouds piled higher and higher, like mountains of darkness rising upon the horizon. The wind began to blow harder.</p>\n<p>Then, suddenly, wave after wave rose upon the sea. The wind roared. The whole sea seemed to turn upside down. The birds along the shore became frightened. The deer on the hills scattered. Even the fish beneath the water fled in confusion.</p>\n<p>The little game between the wind and the waves continued, again and again, while the boat was tossed violently upon the sea. Some of my Master's disciples were experienced fishermen. They knew the sea. They knew boats. They knew storms. Yet even they became afraid. The fishermen cried out,</p>\n<p>\u201cWe are going to drown!\u201d</p>\n<p>One of them went into the boat and woke my Master.</p>\n<p>\u201cLord, save us!\u201d</p>\n<p>My Master awoke. He looked at them and said,</p>\n<p>\u201cWhy are you so afraid? Do you still have no faith?\u201d</p>\n<p>Then He stood and rebuked the wind and the waves.</p>\n<p>\u201cQuiet! Be still!\u201d</p>\n<p>Immediately, the wind stopped.</p>\n<p>The waves became still.</p>\n<p>The whole sea fell silent. It was like the moment a teacher walks into a classroom and all the children suddenly stop talking.</p>\n<p>The fishermen stared at Him in amazement.</p>\n<p>\u201cWho is this?\u201d they asked.</p>\n<p>\u201cEven the wind and the waves obey Him!\u201d</p>\n<p>The little quarrel between the wind and the waves had certainly made the afternoon more interesting.</p>\n<p>But I was even more proud of my Master. He had shown them that He was Lord over all creation. He spoke only a few words, and the wind and the waves became still.</p>\n<p>For us eagles, that was enough. We saw the wind and the waves obey Him, and we knew that He was Lord over all things. But you human beings are very different. You seem to need Him to show you before you are willing to believe.</p>\n<p>Human beings really are strange.</p>\n<p>When a storm comes, we simply fly away.</p>", "questions": [{"level": 1, "prompt": "What two words did Jesus say to calm the storm?", "choices": ["\u201cRow faster!\u201d", "\u201cQuiet! Be still!\u201d", "\u201cHold on!\u201d", "\u201cWake up!\u201d"], "correct": 1}, {"level": 2, "prompt": "Why were the fishermen especially amazed that Jesus could calm the storm?", "choices": ["They had never seen a boat before", "Even though they were experienced with the sea, they had never seen anyone command the wind and waves and be obeyed", "They thought Jesus was asleep the whole time", "They didn't believe storms were dangerous"], "correct": 1}, {"level": 3, "prompt": "The eagle says eagles simply fly away from a storm, but \u201cyou human beings...seem to need Him to show you before you are willing to believe.\u201d What point is the eagle making about faith?", "choices": ["Humans are braver than eagles", "People often need to see proof before they trust, while the eagle already knew Jesus had power over creation", "Eagles are afraid of storms", "Fishermen should learn to fly"], "correct": 1}]}, {"id": 6, "title": "Chapter 6: Strange Humans", "text": "<img class=\"chapter-illustration\" src=\"images/ch06/ch06_fig1.jpg\" alt=\"Illustration for Chapter 6\" loading=\"lazy\">\n<p>Of all the creatures I had seen in the sky, upon the earth, and in the sea, none seemed more intelligent than human beings.</p>\n<p>They were smaller than the trees, yet they could cut down entire forests. They used wood to build houses, and even built towers that seemed to reach toward the sky. There were far fewer of them than there were sheep or goats, yet they could raise flocks numbering in the thousands. They knew when to sow and when to harvest. They knew when grapes were ripe and how to turn them into wine. Their boys went to school to learn. Their girls braided their hair into beautiful plaits. They could write. They could count. They could build. They could sail farther than we could fly.</p>\n<p>For a long time, I assumed that a people so intelligent must surely know their Master.</p>\n<p>But there was one thing about human beings that I could never understand. They would kneel before things that were not their Master. And somehow, they always seemed to look to those things to tell them who they were.</p>\n<p>One day, I saw a woodcutter in the forest. He worked hard all day, cutting and splitting trees. By the time darkness approached, he was exhausted and hungry. So he cut some firewood and built a fire. With the wood, he cooked a pot of soup and roasted a chicken.</p>\n<p>That evening, he ate until he was full and seemed content. The fire gradually burned low. A few pieces of wood remained. He picked up one of them and began to carve.</p>\n<img class=\"chapter-illustration\" src=\"images/ch06/ch06_fig2.jpg\" alt=\"Illustration for Chapter 6\" loading=\"lazy\">\n<p>I watched from a branch above him. His hands were skillful. Before long, the shape of a bird began to appear in the piece of wood. I tilted my head and watched for a long time. It was a bird.</p>\n<p>The man had carved a bird. Then he lifted it high into the air and knelt down before it. He called the wooden bird his master.</p>\n<p>I opened my eyes wide. I could not understand it. A moment before, he had used wood from the very same tree to build his fire, cook his soup, and roast his chicken. Now he had carved the remaining wood into a bird\u2014 and was bowing down before it.</p>\n<p>I thought that if the wooden bird had truly been alive, it would probably have been even more surprised than I was.</p>\n<p>But human beings did not seem to find anything strange about it. They could carve birds. They could carve animals. They could carve human beings. They could even shape metal into images of gods. They lifted up the things they had made with their own hands, and then knelt before them.</p>\n<p>I have heard that some people even offer their sons and daughters to these idols, burning them as sacrifices before things they themselves have made. Whenever I think about this, I understand a little more why my Master was so greatly angered by it. They were creatures made by the hand of their Master.</p>\n<p>Yet they had turned away from Him and worshiped the things they themselves had made. It is something I still cannot understand.</p>\n<p>Every day, we fly through the sky. When morning comes, we know where the sun will rise. When the seasons change, migrating birds know when it is time to leave. Pigeons know their way home. We know when to spread our wings and when to search for a place to rest.</p>\n<p>The birds of the sky know the seasons. The fish of the sea know when the waters rise and when they recede. The animals of the earth know their paths. And yet human beings so often do not know their Master.</p>\n<p>They can study the heavens, yet forget the One who stretched them out. They can sail upon the sea, yet forget the One who walks upon its waves. They can count the stars, yet fail to know the One who placed each of them in the heavens.</p>\n<p>We do not understand everything our Master does. Sometimes we do not even know why He sends the wind from the east, why He causes rain to fall upon one forest and not another, or why He allows a little bird to lose its nest.</p>\n<p>But there is one thing we know:</p>\n<p>We were made by Him.</p>\n<p>He is our Master.</p>\n<p>We do not need to make a master for ourselves.</p>\n<p>Human beings are different. They always seem to need something to take the place of their Master. Sometimes it is a piece of wood. Sometimes a statue of gold. Sometimes power. Sometimes wealth. And sometimes, it is even themselves.</p>\n<p>Human beings really are strange. They are the wisest of all the creatures their Master has made, yet they are strangely prone to forgetting that they themselves were once fashioned by the hand of the Master\u2014 His own carefully made creation.</p>", "questions": [{"level": 1, "prompt": "What did the woodcutter carve out of a piece of firewood at the end of a long day?", "choices": ["A boat", "A bird, which he then knelt before and called his master", "A chair", "A fishing hook"], "correct": 1}, {"level": 2, "prompt": "Why did the eagle find it so strange that the woodcutter bowed down to the carved bird?", "choices": ["The bird looked ugly", "The man had used wood from the very same tree to cook his dinner, yet now knelt before a piece of that same wood as if it were powerful", "Wood is not allowed to be carved", "The eagle wanted the wood for its own nest"], "correct": 1}, {"level": 3, "prompt": "The eagle says humans \u201calways seem to need something to take the place of their Master\u201d\u2014sometimes wood, gold, power, or even themselves. What is the chapter's big idea?", "choices": ["People should never make art", "Animals understand the world better than people do in every way", "People sometimes give their trust and worship to things they made themselves instead of to their Creator", "Woodcutting is a dangerous job"], "correct": 2}]}, {"id": 7, "title": "Chapter 7: My Master Was Crucified", "text": "<img class=\"chapter-illustration\" src=\"images/ch07/ch07_fig1.jpg\" alt=\"Illustration for Chapter 7\" loading=\"lazy\">\n<p>The night wind was quiet.</p>\n<p>My companions and I stood upon the branches of the trees. We heard Jesus and His disciples enter the garden. Jesus walked ahead of them, then knelt beside a stone. Tears streamed down His face as He prayed:</p>\n<p>\u201cFather, if You are willing, take this cup from Me. Yet not My will, but Yours be done.\u201d</p>\n<p>My Master\u2019s fingers gripped the stone tightly. His body was bowed low. His sweat and tears mingled together. The sound of His prayer carried clearly through the silent garden. The birds in the trees and all of us could hear Him. But His disciples were sleeping in the distance.</p>\n<p>I had never seen my Master like this. He had once stood in the midst of wind and waves, and both had obeyed Him. He had healed the sick with a single word.</p>\n<p>But that night, He knelt trembling upon the ground. His face was covered with tears. I did not understand. Why would a Master who could command the wind and the sea tremble upon a stone? I felt that something terrible was about to happen.</p>\n<img class=\"chapter-illustration\" src=\"images/ch07/ch07_fig2.jpg\" alt=\"Illustration for Chapter 7\" loading=\"lazy\">\n<p>From the darkness in the distance came the noisy voices of men and a great glow of fire. Torch after torch appeared along the mountain path, slowly drawing closer. The owls and birds of the forest saw the shouting men and the flames and quickly flew away. I saw metal flashing in the firelight. They were carrying swords.</p>\n<p>One of my Master\u2019s disciples was named Judas. He was the one who came with them, leading a crowd carrying torches. When the other disciples realized that they had come to arrest Jesus\u2014and perhaps them as well\u2014they all ran away.</p>\n<p>Judas kissed Jesus. I heard my Master ask him: \u201cJudas, are you betraying the Son of Man with a kiss?\u201d</p>\n<p>Then they bound Jesus. Their torches formed a river of fire in the night as they led Him toward the town. There, the crowd pushed Jesus into a large courtyard, where they began to put Him on trial.</p>\n<hr class=\"scene-break\">\n<p>I actually liked the rules of human courts. Humans used courts to settle disputes. Their courts had reasons and order. They were not like us eagles, who sometimes settle our disputes by fighting until one of us is dead.</p>\n<p>In a human court, people took turns speaking. Even a wicked man accused of a crime was given an opportunity to answer. During a trial, no one was supposed to beat the accused.</p>\n<p>I had once tried to persuade my eagle companions that we should establish a court among ourselves. But none of us eagles knew what to do next. I thought perhaps we needed scholars who had spent many years studying, just as humans did.</p>\n<p>But that night was different. The one standing trial was Jesus, their Teacher. He stood before a gathering of learned men, His face exhausted. A gust of wind came through the night. I spread my wings and let it carry me in a wide circle above the courtyard so I could hear what they were saying.</p>\n<p>That night, one person after another spoke. Some made accusations. Some shouted. Some had already nodded to one another before Jesus had even answered. I could not understand why they were in such a hurry to condemn a man. Should they not listen first? These learned men questioned Him while mocking Him at the same time.</p>\n<p>Jesus said very little.</p>\n<p>The charge against Him was that He claimed to be the Son of God, the Christ.</p>\n<p>He answered almost nothing. Only when they asked Him whether He was the Son of God did He speak.</p>\n<p>My Lord, why are You silent?</p>\n<p>You are like a lamb led to the slaughter, silent before those who would kill You. I have seen ravens fighting over the blood of sheep at the slaughterhouse.</p>\n<p>You who judge Him, do you not see? How did He teach the people? Did they not love Him? How many among you have listened to His teaching? His words were like a lamp for the path, shining within your hearts. How can you welcome Him in the daylight and condemn Him at night? If what He says is false, this will pass away on its own. You do not need to do anything to Him. But if what He says is true, why do you reject Him?</p>\n<p>After a night filled with accusations, those learned men sentenced Jesus to death. At the moment the sentence was pronounced, the wind stopped. I almost fell from the sky.</p>\n<p>I cried.</p>\n<img class=\"chapter-illustration\" src=\"images/ch07/ch07_fig3.jpg\" alt=\"Illustration for Chapter 7\" loading=\"lazy\">\n<p>For the first time, I learned that human beings did not always need swords to fight. They could also kill a man with lies, power, and a judgment. A war without swords could tear at my heart just as deeply.</p>\n<p>Those learned men did not have the authority to carry out a death sentence, so they had to hand Jesus over to the Roman governor and his soldiers. They all agreed that He should be taken to their governor as quickly as possible.</p>\n<p>At daybreak, they bound Jesus and brought Him to their governor, Pilate.</p>\n<hr class=\"scene-break\">\n<p>As I circled above the city, I suddenly saw Judas, the one who had betrayed his Teacher. He stood alone beneath a tree, his head bowed, his heart filled with grief and regret. He went to the learned men who had accused Jesus. He wanted to return the bag of money they had given him, but they would not take it.</p>\n<p>I did not understand. He had followed my Master. He had walked with Him from place to place. Why, in the end, had he betrayed Him? Judas threw the money into the temple. The coins scattered across the floor. Then he went outside the city and hanged himself beneath a tree.</p>\n<p>The next morning, as the first light of dawn had barely risen above the city walls, the streets were already growing noisy. I circled high above the city and saw crowds gathering in the square before the governor\u2019s headquarters. Some hurried in from the city. Some stood along the roads, watching. Others walked while loudly discussing everything that had happened the night before. More and more people arrived.</p>\n<img class=\"chapter-illustration\" src=\"images/ch07/ch07_fig4.jpg\" alt=\"Illustration for Chapter 7\" loading=\"lazy\">\n<p>From above, I saw that the square was already filled with people. When we eagles want to watch a fight, only a few of us need to gather. But humans are different. They like to gather together until their voices become louder than any one voice could ever be. I heard people shouting. I saw them pointing toward the center of the square. Roman soldiers stood all around them, weapons in their hands.</p>\n<p>Then I saw my Master.</p>\n<p>The soldiers brought Him out. I knew they must have beaten Him. There were bloodstains and marks across His body.</p>\n<p>Beside Him stood another man who had also been brought out under guard. I had heard his name before.</p>\n<p>Barabbas.</p>\n<p>He was a robber, a man who had committed crimes. I looked at him.</p>\n<p>Then I looked at my Master. The crowd grew louder and more agitated.</p>\n<p>I saw a great black cloud above Barabbas\u2019s head. It was heavier than any dark cloud I had ever seen before.</p>\n<p>Then I looked at the Lord Jesus. He said nothing. His countenance seemed to shine above the square.</p>\n<p>My Lord, why are You silent?</p>\n<p>The governor told the crowd that he had the authority to release one prisoner. He asked them whether they wanted him to release this robber, or Jesus\u2014the One who had taught them and whom they had once loved.</p>\n<p>The crowd shouted:</p>\n<p>\u201cBarabbas!\u201d</p>\n<p>The wicked man Barabbas walked proudly into the crowd and disappeared. The black cloud followed him.</p>\n<p>Pilate asked what should be done with Jesus. The crowd shouted:</p>\n<p>\u201cCrucify Him!\u201d</p>\n<p>\u201cCrucify Him!\u201d</p>\n<p>Their cries echoed throughout the city and frightened every bird that had been resting in its nest. We all flew away.</p>\n<p>We old eagles had often flown over the hill outside the city where men were crucified. We had seen how the Roman soldiers carried out their executions. Before a crucifixion, the soldiers stripped the condemned man of all his clothing, even his undergarments. The bodies hanging naked upon the crosses made it easier for ravens and vultures to tear at their flesh. The smell of blood was always there. Ravens and vultures were always circling overhead. But I had never imagined that one day my own Master would hang there. Then I understood something. The men hanging upon those pieces of wood had once been loved by someone. And today, the One who would hang there was my Master.</p>\n<p>The Roman soldiers forced my Master to carry His cross. It was taller than He was, and He could no longer carry it.</p>\n<p>They came to the top of the hill. The soldiers mocked my Master. They twisted together a crown of thorns and placed it upon His head.</p>\n<p>The thorns pierced His skin. Blood ran down His face and blurred His vision. The soldiers stretched out my Master\u2019s hands and drove nails through them into the wood. Then they raised the cross.</p>\n<p>Two other criminals were crucified beside Him. One of them was so heavy that, when his body hung from the cross, the bones in his hands tore under the weight.</p>\n<p>The pain was so terrible that he endured it while continually cursing God.</p>\n<p>But the other criminal rebuked him.</p>\n<p>\u201cDo you not fear God? We are receiving what we deserve. But this man has done nothing wrong.\u201d</p>\n<p>Then, with the little strength remaining in him, he spoke to my Master from the cross, his voice weak and sorrowful:</p>\n<p>\u201cJesus, remember me when You come into Your kingdom.\u201d</p>\n<p>I heard my Master answer him:</p>\n<p>\u201cTruly I tell you, today you will be with Me in paradise.\u201d</p>\n<p>I lifted my eyes toward the heavens. I saw countless hosts of angels. Their faces were solemn as they watched what was happening below. Without my Master\u2019s command, they waited. At His single word, they could descend from heaven in an instant.</p>\n<p>My Lord, why are You silent?</p>\n<p>You could command the armies of angels\u2014and we warriors of the sky\u2014to rescue You from these hateful humans.</p>\n<p>My Lord, why do You not command us? If You commanded me, I would fly down this very moment. I could seize those soldiers with my talons. I could drive them all away with my wings. All of us eagles could descend together. We could fill the entire hilltop with wings. The armies of angels could easily lift You down from the cross and restore You to Your glorious and majestic throne.</p>\n<p>My Lord, why do You allow these humans to shame You?</p>\n<p>My companions and I circled above the hill, crying out. Whenever ravens or vultures came near Your cross, we drove them away with our cries. We would not allow them to touch You.</p>\n<p>In the afternoon, darkness suddenly fell.</p>\n<p>The whole earth grew dark. I heard my Master say:</p>\n<p>\u201cMy God, My God, why have You forsaken Me?\u201d</p>\n<p>I looked at Him. He said nothing more. His head bowed. Then He breathed His last. My Master was dead.</p>\n<p>Suddenly, the earth shook violently. In the distance, great stones broke loose from the cliffs and crashed down. Birds burst into the air. Deer fled into the forest. Every creature beneath the earth hid in fear.</p>\n<p>The soldiers cried out in terror:</p>\n<p>\u201cSurely He was the Son of God!\u201d</p>\n<p>The Roman officer named Centurion beat his chest and wept bitterly.</p>\n<p>\u201cI have killed my Teacher and the Son of God,\u201d he cried.</p>\n<p>\u201cWhy did I not have the courage to refuse the command of my commander?\u201d</p>\n<p>\u201cI should have risked my life for a good man. Why did I not?\u201d</p>\n<p>I had seen Centurion before. When my Master taught, he had listened with excitement and seriousness. There had been fire in his heart. There had been light above his head. But now his face was covered with tears. He stood beneath the cross and wept.</p>\n<p>Centurion, it is too late to weep now.</p>\n<p>My Master is dead. I grieved with you.</p>\n<p>The owl\u2019s brow was deeply furrowed.</p>\n<p>The eagles\u2019 beaks were tightly closed.</p>\n<p>Our Lord hung beneath the crown of thorns, the cruel crown covering His suffering brow.</p>\n<p>This was a knot we could not understand.</p>\n<p>A knot that would become part of history.</p>\n<p>Our hearts could not be still.</p>\n<img class=\"chapter-illustration\" src=\"images/ch07/ch07_fig5.jpg\" alt=\"Illustration for Chapter 7\" loading=\"lazy\">", "questions": [{"level": 1, "prompt": "What did the crowd shout when Pilate asked whether to release Barabbas or Jesus?", "choices": ["\u201cRelease them both!\u201d", "\u201cBarabbas!\u201d", "\u201cJesus!\u201d", "\u201cSend them home!\u201d"], "correct": 1}, {"level": 2, "prompt": "The eagle wonders, \u201cWhy would a Master who could command the wind and the sea tremble upon a stone?\u201d What does this question show about what the eagle expected?", "choices": ["The eagle expected Jesus to use His power to escape suffering, and was confused when He didn't", "The eagle thought Jesus was too weak to be a real teacher", "The eagle no longer believed Jesus had any power", "The eagle wanted Jesus to fight the soldiers"], "correct": 0}, {"level": 3, "prompt": "The angels and eagles are ready to rescue Jesus at His word, but He never gives the command. What does this suggest about His choice to go to the cross?", "choices": ["Jesus forgot He had the power to escape", "Jesus chose to suffer on purpose rather than use His power to save Himself", "The angels refused to help Him", "It was an accident no one could have stopped"], "correct": 1}]}, {"id": 8, "title": "Chapter 8: He Rose from the Dead", "text": "<img class=\"chapter-illustration\" src=\"images/ch08/ch08_fig1.jpg\" alt=\"Illustration for Chapter 8\" loading=\"lazy\">\n<p>Before sunset, they took my Master\u2019s body down from the cross.</p>\n<p>A disciple named Joseph went to Pilate and asked for my Master\u2019s body. With the help of several others, he washed the blood and wounds from my Master\u2019s body. Then they wrapped Him in thick, white linen and laid Him in a new tomb.</p>\n<p>Beside the entrance of the tomb was a great round stone, taller than a man. It was slightly higher than the opening and was meant to seal the tomb. They placed my Master\u2019s body on the stone bed inside the tomb and came out. Then several men pushed together and rolled the great stone into place.</p>\n<p>The entrance was sealed. A small company of Roman soldiers came to guard the tomb.</p>\n<p>Roman soldiers always moved together. They never went alone. Each soldier wore a helmet and metal armor. They carried spears, short swords, and shields.</p>\n<p>Several women who did not want to leave my Master remained nearby, watching the tomb from a distance.</p>\n<p>Those who opposed my Master went to Pilate and told him that Jesus had said He would rise again after three days.</p>\n<p>So they asked Pilate to order the soldiers to guard the tomb, lest Jesus\u2019 disciples come and steal His body and then claim that He had risen from the dead.</p>\n<p>I had seen my Master die with my own eyes.</p>\n<p>His followers had seen Him die as well.</p>\n<p>The soldiers themselves were certain that He had died upon the cross. That was why they had taken His body down.</p>\n<p>You who opposed my Master, why were you so determined to guard His tomb? Did you believe in His resurrection more than we did?</p>\n<hr class=\"scene-break\">\n<p>I flew without knowing where I was going.</p>\n<p>I flew over the places where my Master had once walked and taught. As I approached a narrow gate, I noticed words written above it. They had been written there by some of my Master\u2019s disciples:</p>\n<blockquote>\u201cCome to Me, <br>\nall you who are weary and burdened,<br>\nand I will give you rest.\u201d</blockquote>\n<p>Those words brought great comfort to my Master\u2019s disciples.</p>\n<p>If my Master could endure such unbearable suffering, then surely He could comfort anyone who had suffered\u2014or would ever suffer\u2014the same kind of pain.</p>\n<p>Centurion slowly came to the narrow gate and sat down beneath it. He bowed his head and remained silent for a long time.</p>\n<p>\u201cThe whole earth has been cursed because of man,\u201d he said quietly.</p>\n<p>\u201cThe weight of our sin is heavier than we can carry.\u201d He fell silent again and held his head in his hands.</p>\n<p>\u201cWe are a burden upon the whole earth. The earth itself can hardly bear us.\u201d</p>\n<p>He lifted his head and looked toward the sky. His eyes were filled with weariness.</p>\n<p>\u201cNow we have even killed the Son of God.\u201d</p>\n<p>His voice began to tremble. \u201cHow will we ever escape the judgment that is to come? How will we escape the wrath of God?\u201d</p>\n<p>When he finished speaking, he said nothing for a long while. At last, leaning against the narrow gate, he fell into an exhausted sleep.</p>\n<p>I watched him from nearby. I did not know what to say to him. So I flew back to the top of the cliff.</p>\n<img class=\"chapter-illustration\" src=\"images/ch08/ch08_fig2.jpg\" alt=\"Illustration for Chapter 8\" loading=\"lazy\">\n<hr class=\"scene-break\">\n<p>At the first light of dawn, I had not yet seen the sun. But the sky was already beginning to shine. The light came from the direction of the tomb.</p>\n<p>A pillar of light rose from the earth and reached into the heavens. It grew brighter and brighter. The entire tomb seemed to be surrounded by light. Then, suddenly, I saw countless hosts of angels descending through the pillar of light.</p>\n<p>They came down from the heavens as though the sky itself had opened, and they assembled in perfect order before the tomb. A mighty earthquake followed. One of the angelic warriors rolled the great stone away.</p>\n<p>Two angels entered the tomb to wait for my Master. The great hosts of angels remained outside, standing in perfect ranks.</p>\n<p>The tomb was filled with light. And then I saw my Master standing there. The linen cloths that had wrapped His body were still lying upon the stone bed.</p>\n<p>My Master had risen. Light came forth from Him. It grew brighter and brighter until it shone more brilliantly than the light of the sun itself. I could hardly look at Him.</p>\n<p>I could not believe what I was seeing. Only yesterday, I had watched Him die upon the cross. I had seen Him bow His head. I had seen Him breathe His last.</p>\n<p>But now He was standing inside the tomb. He was alive.</p>\n<p>My Master was alive.</p>\n<p>He spoke to the angels waiting outside:</p>\n<p>\u201cI have someone I must go and see.\u201d</p>\n<p>He instructed the two leading angels to remain, while the rest of the heavenly host withdrew in perfect order toward the horizon.</p>\n<p>Then Mary Magdalene came out from behind a tree. Weeping, she ran toward the tomb. She looked inside and saw two angels dressed in white. But my Master was no longer there. She saw Him, but she thought He was the gardener. Through her tears, she cried:</p>\n<p>\u201cThey have taken my Lord away, and I do not know where they have put Him.\u201d</p>\n<p>Then my Master called her by the voice she knew so well.</p>\n<p>\u201cMary.\u201d</p>\n<p>Her eyes opened wide. She recognized Him. So that was the person my Master had said He was going to see.</p>\n<p>Mary Magdalene.</p>\n<p>My Master said to her:</p>\n<p>\u201cDo not hold on to Me, for I have not yet ascended to the Father.\u201d</p>\n<p>\u201cGo instead to My brothers and tell them, \u2018I am ascending to My Father and your Father, to My God and your God.\u2019\u201d</p>\n<p>Mary Magdalene could hardly believe what she had seen. Tears of overwhelming joy filled her face. She ran to tell the other disciples everything. As she ran, she kept crying out:</p>\n<p>\u201cHe is alive! He is alive!\u201d</p>\n<p>I flew excitedly above her. I had seen it with my own eyes. I had seen how my Master had risen from the dead.</p>\n<p>As Mary approached the village and began telling the other disciples, I remembered Centurion, still sitting beneath the narrow gate.</p>\n<p>Centurion did not know that my Master had risen from the dead. He did not know that the judgment he had feared the night before was no longer the same. I decided to turn back and tell him the good news.</p>\n<p>I flew to the narrow gate. Centurion was still asleep. I woke him with a sharp cry. He seemed to understand that I had something important to tell him. He stood up and followed me. I flew ahead, leading him toward the place where Mary Magdalene and the other disciples had gathered. I flew in front. Centurion followed behind. He still did not know where I was taking him. But I knew.</p>\n<p>I was going to show him what I had seen!</p>\n<p>I was going to show him glory!</p>\n<p>My Master was alive!</p>", "questions": [{"level": 1, "prompt": "Who did the risen Jesus first call by name near the tomb?", "choices": ["Peter", "Judas", "Mary Magdalene", "Centurion"], "correct": 2}, {"level": 2, "prompt": "Why did the religious leaders ask Pilate to place soldiers to guard Jesus's tomb?", "choices": ["They were worried thieves would steal valuables from the tomb", "They remembered Jesus said He would rise again and wanted to prevent anyone from faking that story", "They wanted to protect Jesus's body out of respect", "Pilate ordered them to do it"], "correct": 1}, {"level": 3, "prompt": "The eagle asks, \u201cDid you believe in His resurrection more than we did?\u201d about the people who set the guard. What is the irony (surprising twist) in this question?", "choices": ["The guards fell asleep", "The very people who doubted Jesus took the resurrection seriously enough to guard against it, showing they weren't as sure of their doubt as they claimed", "The soldiers were friends of Jesus", "There was no guard at all"], "correct": 1}]}, {"id": 9, "title": "Chapter 9: Centurion's Change", "text": "<img class=\"chapter-illustration\" src=\"images/ch09/ch09_fig1.jpg\" alt=\"Illustration for Chapter 9\" loading=\"lazy\">\n<p>Centurion began to look back over his life.</p>\n<p>When he was young, he had been chosen to become a Roman soldier because he was taller than most boys his age. He learned quickly and obeyed orders well, so he was soon promoted to an officer. He was also better than most soldiers at reading people and handling difficult situations.</p>\n<p>He allowed his soldiers to plunder the people they were supposed to protect, and because of this, he was popular among them. Of course, he required his soldiers to give him a share in return, and over the years he had accumulated considerable wealth.</p>\n<p>But now, Centurion was filled with grief. He hated himself. Why had he not ordered the soldiers to stop when they were crucifying Jesus?</p>\n<p>He despised the cowardice that had held him back.</p>\n<p>He had seen the evil within his own heart. He had seen the deceit and wickedness hidden within the human heart.</p>\n<p>A terrible realization took hold of him. The evil within his own heart was not his alone. It was the evil of humanity\u2014 the evil passed down from generation to generation, from the beginning, through his own time, and into generations yet to come.</p>\n<p>What frightened him even more was that this evil seemed to have no end. He thought bitterly:</p>\n<p>\u201cGod can judge the evil of humanity, but it seems He cannot change the evil within us, nor the suffering and misery that evil has brought upon the world.\u201d</p>\n<p>Questions churned within Centurion\u2019s mind.</p>\n<p>How can we escape the judgment that is to come?</p>\n<p>What can change the miserable fate of humanity?</p>\n<hr class=\"scene-break\">\n<p>In the marketplace, Peter stood up and called out to the great crowd:</p>\n<p>\u201cMen of Israel, and all who dwell in Jerusalem!\u201d</p>\n<p>Centurion was patrolling around the edge of the crowd, but his ears were listening carefully to every word that came from Peter\u2019s mouth.</p>\n<p>Peter cried out:</p>\n<p>\u201cJesus was delivered up according to the definite plan and foreknowledge of God. You, by the hands of lawless men, put Him to death by nailing Him to the cross.\u201d</p>\n<p>Centurion felt a sharp pain in his heart.</p>\n<p>For he and his soldiers had been the very hands that nailed the Lord Jesus to the cross.</p>\n<p>Peter continued, speaking boldly to the people.</p>\n<p>He proclaimed:</p>\n<p>\u201cGod raised Jesus from the dead and released Him from the agony of death.\u201d</p>\n<p>\u201cThe foreknowledge of God.\u201d</p>\n<p>Those words seized Centurion\u2019s heart.</p>\n<p>He thought:</p>\n<p>\u201cCould it be that even our killing of Jesus was known beforehand by God?\u201d</p>\n<p>He remembered something he had once heard Jesus teach:</p>\n<p>\u201cFor God so loved the world that He gave His only Son, that whoever believes in Him should not perish but have eternal life.\u201d</p>\n<p>The knot in Centurion\u2019s heart began, slowly, to loosen. Those words were beginning to make sense.</p>\n<p>\u201cWho is this Son?\u201d Centurion asked himself.</p>\n<p>\u201cJesus.\u201d He answered himself.</p>\n<p>\u201cWhy did Jesus have to be killed?\u201d</p>\n<p>\u201cHe gave His only Son.\u201d Again, he answered himself.</p>\n<p>\u201cAnd what was the purpose?\u201d</p>\n<p>\u201cThat whoever believes in Him should not perish but have eternal life.\u201d</p>\n<p>For the first time, Centurion could see a way out of humanity\u2019s miserable fate. He whispered:</p>\n<p>\u201cNo evil hand can escape eternal judgment.\u201d</p>\n<p>\u201cThe weight of sin is too heavy for a person to carry alone.\u201d</p>\n<p>\u201cIf a sinful man cannot even bear the weight of his own sin, how could he bear the judgment meant for anoth

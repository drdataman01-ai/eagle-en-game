er?\u201d</p>\n<p>\u201cBut God can.\u201d</p>\n<p>\u201cHe freely gave His Son to redeem humanity.\u201d</p>\n<p>\u201cJesus is not only my Teacher. He is the Son of God.\u201d</p>\n<p>\u201cOnly the innocent Son could bear such a burden.\u201d</p>\n<p>\u201cThis is the greatest gift God has ever given to humanity.\u201d</p>\n<p>\u201cHe is changing the destiny of mankind.\u201d</p>\n<p>Peter continued to call boldly for the people to repent. A great crowd was cut to the heart by his words. They received his message, repented, and turned back to God.</p>\n<p>Centurion took off his Roman helmet and breastplate.</p>\n<p>He fell to his knees and cried out:</p>\n<p>\u201cLord Jesus, save me!\u201d</p>\n<p>He decided that he would no longer be a soldier. Several soldiers realized that he had deserted and began pursuing him. He fled into the forest.</p>\n<p>But for Centurion, that day was a day of victory. His courage had overcome his fear. Deep in the forest, he lifted his voice and rejoiced.</p>\n<p>I watched from the top of a tree as Centurion disappeared into the forest. I also watched Peter and the great crowd gathered around him. The eagle eyes my Golden Eagle teacher had taught me to use allowed me to see what others could not. A great white cloud called <strong>Redemption</strong> rested above them. They breathed it in like green shoots drinking in the morning dew. They drew in the fresh air of that cloud, breath after breath.</p>\n<p>The pale faces of the people began to regain their color. Their chests filled with breath. Their weak legs grew strong again, and they stood firmly upon the ground.</p>\n<p>I remembered the question Centurion had once asked. What can a person live by? Now I knew the answer.</p>\n<p>A person does not live by his own strength.</p>\n<p>A person lives by redemption.</p>", "questions": [{"level": 1, "prompt": "What did Centurion do with his helmet and breastplate after Peter's speech?", "choices": ["He sold them", "He took them off and knelt down, deciding to no longer be a soldier", "He gave them to Titus", "He polished them"], "correct": 1}, {"level": 2, "prompt": "What realization made Centurion feel that humanity's problem was bigger than he first thought?", "choices": ["He realized soldiers were paid too little", "He saw that the evil in his own heart wasn't just his personal fault, but part of an evil passed down through all of humanity", "He discovered his soldiers were stealing from him", "He learned Rome was losing a war"], "correct": 1}, {"level": 3, "prompt": "Centurion concludes, \u201cA person does not live by his own strength. A person lives by redemption.\u201d What does this final idea mean in the context of the chapter?", "choices": ["People should exercise more to grow stronger", "True change and hope come from being rescued and forgiven, not from trying harder on your own", "Soldiers are the strongest people in the world", "Redemption means winning a battle"], "correct": 1}]}, {"id": 10, "title": "Chapter 10: Stephen Is Stoned to Death", "text": "<img class=\"chapter-illustration\" src=\"images/ch10/ch10_fig1.jpg\" alt=\"Illustration for Chapter 10\" loading=\"lazy\">\n<p>That day, I flew across the familiar sky and along the cliffs above the sea. I missed my teacher. I missed my Golden Eagle companions. It was about the time they would be returning. Would they come back? Would I see them again? I had so many things to tell them. So many things I had seen.</p>\n<p>My Golden Eagle teacher had taught me how to see what mortal eyes cannot see. He told me that an eagle's eyes were not merely for seeing farther. They were for seeing the glory the Creator wanted us to see.</p>\n<p>Now I could see it.</p>\n<p>True glory was Him.</p>\n<p>Words of life came from His mouth.</p>\n<p>His words were like light, entering the hearts of people.</p>\n<p>He was tortured by the very people He loved. He was humiliated in the marketplace. Yet even when His body was covered with wounds, His dignity still shone.</p>\n<p>That was true glory.</p>\n<p>My Master.</p>\n<hr class=\"scene-break\">\n<p>Suddenly, I saw a light in the distant sky. I opened my eyes wide. At the center of the light, the shape of a Golden Eagle slowly appeared. It was my teacher. And beside him was an angel.</p>\n<p>My teacher! I had so much to tell you. It would take many days to tell it all. I was even worried that I would speak too slowly, or that I would not find the right words. For years, I had practiced the moment when we would meet again. I was afraid that if I could not tell my stories well, you would not understand them.</p>\n<p>But at that very moment, my Golden Eagle teacher looked into my eyes. I looked into his.</p>\n<p>And in that instant, it seemed that he already knew every word I had wanted to say, every story I had wanted to tell, every thing I had seen during all those years. At that moment, I realized that words were unnecessary. We said nothing. We simply flew together, circling in the sky.</p>\n<p>My teacher! I wished that moment could last forever. That you and I, together with the others, could keep flying all the way to the sunset at the edge of the world.</p>\n<img class=\"chapter-illustration\" src=\"images/ch10/ch10_fig2.jpg\" alt=\"Illustration for Chapter 10\" loading=\"lazy\">\n<hr class=\"scene-break\">\n<p>Suddenly, I heard the voice of the angel. It carried the strength of the whole sky. He called to me:</p>\n<p>\u201cGo. Carry Stephen to the throne in heaven.\u201d</p>\n<p>I did not know who Stephen was. I did not know what was happening below. But I knew this was my Master's command. So I spread my wings and followed the angel downward. We descended from the sky.</p>\n<p>I saw several learned men leading an angry mob toward the center of the city. They were accusing a man named Stephen.</p>\n<p>Their voices were too far away for me to understand clearly, but the wind heard everything. The wind often told me things it heard along the way. Sometimes I heard the wind sighing over humanity.</p>\n<p>I heard farmers speaking of Stephen\u2014 of his noble character, and of all he had done for ordinary people. The farmers loved Stephen because he cared for them and taught them.</p>\n<p>Then I saw three gray, shadowy frogs slipping through the angry crowd. I had a terrible feeling about them. The last time I had seen them, they had been hiding beneath a dead hen, trying to escape the vultures.</p>\n<p>They were the lying frogs.</p>\n<p>The wind had heard those three frogs spreading rumors about Stephen, claiming that he had spoken against their ancestors, against the Creator, and against many other things.</p>\n<p>The mob moved toward Stephen.</p>\n<p>Stephen raised his voice, trying to calm them.</p>\n<p>The learned leaders told the crowd to be silent for a moment and gave Stephen one last opportunity to speak. The silence that followed was like the silence of vultures waiting before they descend upon their prey.</p>\n<p>I saw Stephen standing in the middle of the dark, angry crowd. Above his head, he seemed to shine like a diamond.</p>\n<p>Stephen began to speak. He started with a story from long ago. He spoke of Abraham. Of Joseph. Of Moses. Of how the people of Israel came out of Egypt. He spoke of how God had continually led His people, and how the human heart had repeatedly rejected Him. And finally, he spoke of my Master. He said that human beings had handed over the Righteous One to be killed. The people grew more and more furious as they listened. When Stephen finished speaking, they began throwing stones at him. Stone after stone fell upon him until Stephen disappeared beneath the heap.</p>\n<p>I dove toward him at once. I reached him just before his body fell. I heard Stephen say:</p>\n<p>\u201cLord Jesus, receive my spirit.\u201d</p>\n<p>Then his spirit left his body. I flew above Stephen and carefully grasped his spirit in my talons. I spread my wings around him to protect him. I held him as gently and firmly as I could, careful not to let my sharp talons wound him. Then I beat my wings with all my strength and rose from the earth. I followed the direction the angel had shown me and flew toward the throne in heaven. It was the fastest, hardest flight of my entire life.</p>\n<p>His clothing fluttered in the wind. His eyes were closed. He curled himself inward and whispered:</p>\n<p>\u201cLord, do not hold this sin against them.\u201d</p>\n<p>Then he fell asleep.</p>\n<img class=\"chapter-illustration\" src=\"images/ch10/ch10_fig3.jpg\" alt=\"Illustration for Chapter 10\" loading=\"lazy\">\n<p>At last, I saw the dawn, the sea of glass, and the throne in heaven. At the center, before the sea of glass, a place had already been prepared for Stephen.</p>\n<p>I descended gently and carefully laid him down.</p>\n<p>Then I heard the thunderous applause of heaven. I saw my Master rise. He looked at Stephen and said:</p>\n<p>\u201cWell done, good and faithful servant. You have been faithful over a little on earth; I will set you over much. Come and share in the joy of your Master.\u201d</p>\n<p>Then my Master looked at me.</p>\n<p>My face felt hot, because His eyes seemed to see straight through me. I could not speak. All I could manage was an awkward little:</p>\n<p>\u201cAh!\u201d</p>\n<p>It was a very embarrassing moment to make such a sound in front of my Master.</p>\n<p>But my Master knew how hard I had worked to bring Stephen there.</p>\n<p>My Master knew.</p>\n<p>Then the applause of heaven turned toward me. They applauded the care with which I had carried Stephen and gently laid him down. I heard the angels saying:</p>\n<p>\u201cLook at that strong eagle!\u201d</p>\n<p>How had I become a strong eagle? Then I noticed that my feathers and tail feathers were shining. My wings were no longer mottled. I had grown into a true eagle.</p>\n<p>Only then did I realize that I had just carried a great and faithful servant of the Lord.</p>\n<p>I flew joyfully across the sky, from east to west.</p>\n<p>My spirit was glad.</p>\n<p>My will was strong.</p>\n<p>The whole sky seemed to belong to me.</p>\n<p>I flew through the storm.</p>\n<p>My eagle talons had become strong as steel.</p>\n<p>With my mortal eyes, I could see the little creatures far below.</p>\n<p>With my eagle eyes, I could discern the clouds of good and evil.</p>\n<p>I was a masterpiece of the Creator.</p>\n<p>I was an eagle who served my Lord.</p>", "questions": [{"level": 1, "prompt": "What was the eagle commanded to do for Stephen after he was stoned?", "choices": ["Bury his body", "Carry his spirit up to the throne in heaven", "Warn the crowd to stop", "Fly and find Peter"], "correct": 1}, {"level": 2, "prompt": "What had the golden eagle teacher meant when he said an eagle's eyes \u201cwere for seeing the glory the Creator wanted us to see\u201d?", "choices": ["Eagles should only look at sunsets", "True sight isn't just about distance\u2014it's about recognizing what is truly valuable and holy, like Jesus's dignity even in suffering", "Eagles need better eyesight than other birds", "Glory means being famous"], "correct": 1}, {"level": 3, "prompt": "After completing his task, the eagle notices his feathers now shine and he has \u201cgrown into a true eagle.\u201d What does this change suggest about the chapter's theme?", "choices": ["Eagles change feathers every year regardless of what they do", "Faithfully serving and caring for others, even in a hard task, is part of what makes someone (or some eagle) become their fullest, truest self", "Flying long distances always changes an eagle's color", "Stephen gave the eagle magical powers"], "correct": 1}]}, {"id": 11, "title": "Chapter 11: Walk With Him Two Miles", "text": "<img class=\"chapter-illustration\" src=\"images/ch11/ch11_fig1.jpg\" alt=\"Illustration for Chapter 11\" loading=\"lazy\">\n<p>Centurion had served in the Roman army for twenty years. According to military custom, he could have served for several more years before retiring. When he retired, he would have received a pension, or perhaps a piece of land. It had once seemed like a safe and orderly path through life.</p>\n<p>But none of those things mattered to him anymore. He had become an ordinary man. He often thought about his old comrades, especially the friends with whom he had once laughed and complained.</p>\n<p>Now he had something far more important to tell them.</p>\n<p>He met one of his former soldiers, a man named Titus. Titus was astonished that Centurion had deserted\u2014and even more astonished to see him back again. He desperately wanted to know what had happened.</p>\n<p>Titus was carrying a large wooden crate of supplies. He was standing beside a Roman milestone, about to force a non-Roman citizen to carry his load. Under Roman rule, soldiers could compel local people to carry military supplies and baggage for them.</p>\n<p>Centurion looked at the man and felt a sudden pang of pity. He said to Titus,</p>\n<p>\u201cLet me carry it for you.\u201d</p>\n<p>He reached out and took the load, hoping to have a chance to speak with Titus alone. But Titus refused.</p>\n<p>\u201cNo. You don't have to carry it.\u201d</p>\n<p>Titus insisted on carrying it himself. And so the two men continued together along the Roman road.</p>\n<p>After a while, Titus could no longer hold back his question.</p>\n<p>\u201cYou ran away when Peter was preaching in the city square. Where did you go?\u201d</p>\n<p>\u201cI found Him,\u201d Centurion answered.</p>\n<p>Titus stared at him. For a moment, he thought Centurion had discovered some kind of treasure in the forest.</p>\n<p>Centurion smiled and continued.</p>\n<p>\u201cDo you remember what that Jew Peter said?\u201d</p>\n<p>\u201cJesus, the One who was crucified, has risen from the dead.\u201d</p>\n<p>\u201cIt is true.\u201d</p>\n<p>Titus was silent for a while.</p>\n<p>He had heard Jesus teach, too. Even after Jesus was crucified, Titus had heard many stories about Him from other people. Most of those stories had come from the very people he had forced to carry heavy loads for a mile. They were followers of Jesus\u2014mostly Jewish men and women, and even boys and girls.</p>\n<p>They were different from other people.</p>\n<p>They did not complain about being forced to carry heavy burdens. Some of them were even willing to walk an extra mile, simply so they could tell Titus more about Jesus. They spoke with courtesy and dignity. Strangest of all, everything they told him seemed to be true.</p>\n<p>Titus had noticed that even the Jews who opposed Jesus could not completely deny what had happened. And before leaving, those followers who had walked with him two miles always asked him the same question:</p>\n<p>\u201cDo you believe?\u201d</p>\n<p>Now even his closest friend, Centurion, was telling him the same thing.</p>\n<p>And the change in Centurion was real. Titus looked at his face. There was a light in him that had not been there before. He no longer looked like the tired and discouraged soldier Titus had once known.</p>\n<p>\u201cBut what does the death and resurrection of Jesus have to do with us?\u201d Titus asked.</p>\n<p>They continued walking.</p>\n<p>Titus was not the kind of man who picked up a book and read it carefully from beginning to end. He read here and there, when he felt like it.</p>\n<p>He laughed.</p>\n<p>\u201cMy simple mind cannot possibly fit love, sin and punishment, military affairs, physics, and Aristotle all into one thought.\u201d</p>\n<p>Centurion laughed with him. Titus continued,</p>\n<p>\u201cAnd I don't want to speak carelessly about Jesus.\u201d</p>\n<p>\u201cThere is no king but Caesar.\u201d He was silent for a moment.</p>\n<p>Then he said,</p>\n<p>\u201cBut there is something I have never been able to understand.\u201d</p>\n<p>\u201cIf there really is a God who created heaven and earth, why does He watch human beings kill one another and destroy one another?\u201d</p>\n<p>Centurion looked down the long road ahead.</p>\n<p>After a while, he said,</p>\n<p>\u201cAnimals are born, and animals die. That is their nature.\u201d</p>\n<p>\u201cHuman beings are born, and human beings die. That is our nature, too.\u201d</p>\n<p>Titus nodded.</p>\n<p>\u201cI cannot disagree with that.\u201d</p>\n<p>Centurion continued.</p>\n<p>\u201cGreat kings conquer other nations, and in the end, they die, too.\u201d</p>\n<p>\u201cNo one is immortal.\u201d</p>\n<p>Then Centurion asked,</p>\n<p>\u201cBut why do human beings kill one another?\u201d</p>\n<p>Titus said nothing. Centurion continued.</p>\n<p>\u201cBecause there is selfishness in the human heart. And there is evil.\u201d</p>\n<p>\u201cNot everyone is evil,\u201d Titus quickly replied. \u201cThere is goodness in people, too.\u201d</p>\n<p>Centurion nodded.\u201cI know.\u201d</p>\n<p>\u201cBut can you guarantee that a person's goodness will never change?\u201d</p>\n<p>Titus did not answer. Centurion continued.</p>\n<p>\u201cA man may be good today. He may be good tomorrow.\u201d</p>\n<p>\u201cBut what if he is given enough temptation?\u201d</p>\n<p>\u201cWhat if he is given enough money?\u201d</p>\n<p>\u201cWhat if he is given enough power?\u201d</p>\n<p>Titus fell silent. He knew Centurion was speaking the truth. Human goodness can be real. But human goodness is not perfect. Fear can change it. Greed can change it. Power can change it. And it can never remain perfect forever.</p>\n<p>Centurion remembered something Jesus had once said:</p>\n<p>\u201dBe perfect, therefore, as your heavenly Father is perfect.\u201d</p>\n<p>He spoke slowly.</p>\n<p>\u201cWhen Jesus said \u2018perfect,' He was not talking about being a good person for a day or two.\u201d</p>\n<p>He said \u2018perfect.'</p>\n<p>Titus looked down at the Roman road beneath his feet. They walked for a while. Then Titus suddenly said,</p>\n<p>\u201cI remember when I was studying, one of my teachers spoke about Socrates.\u201d</p>\n<p>\u201cWe talked about the human soul. We talked about what kind of person could truly be called holy.\u201d</p>\n<p>\u201cHe lifted his head and looked at Centurion.\u201d</p>\n<p>\u201cBut what if there is no one who can remain righteous forever?\u201d</p>\n<p>Centurion stopped walking.</p>\n<p>He looked at Titus. \u201cYou are right.\u201d</p>\n<p>\u201cThere is no one in this world who can remain righteous forever.\u201d</p>\n<p>\u201cThere was no one in the past.\u201d</p>\n<p>\u201cThere is no one now.\u201d</p>\n<p>\u201cAnd there will be no one in the future.\u201d</p>\n<p>He paused. Then he said,</p>\n<p>\u201cExcept One.\u201d</p>\n<p>Titus looked at him. Centurion spoke quietly.</p>\n<p>\u201cJesus. He is the Son of God.\u201d</p>\n<p>Titus said nothing. Centurion continued.</p>\n<p>\u201cWe nailed Him to a cross.\u201d</p>\n<p>\u201cAnd now I understand.\u201d</p>\n<p>That was not an accident. \u201cIt was not merely a tragedy.\u201d</p>\n<p>\u201cThe Father knew from the beginning that humanity would nail His Son to the cross.\u201d</p>\n<p>\u201cAnd yet the Father still loved the world.\u201d</p>\n<p>\u201cHe even gave His only Son, Jesus, to take away the sins of the world.\u201d</p>\n<p>Titus walked slowly. He said nothing. Centurion did not hurry him. After a while, Centurion asked,</p>\n<p>\u201cDo you know what I saw beneath the cross?\u201d</p>\n<p>Titus shook his head.</p>\n<p>\u201cI saw an innocent Man suffer for the guilty.\u201d</p>\n<p>\u201cI saw a Man who did not need to die, die for us.\u201d</p>\n<p>\u201cI once thought that was defeat.\u201d</p>\n<p>\u201cNow I know it was redemption.\u201d</p>\n<p>Titus slowly raised his head.</p>\n<p>\u201cBut why did He have to die?\u201d</p>\n<p>Centurion answered,</p>\n<p>\u201cBecause sin brings death.\u201d</p>\n<p>\u201cWe have sinned ourselves. How could we possibly remove our own sin by ourselves?\u201d</p>\n<p>\u201cA guilty person cannot even bear the weight of his own sin. How could he bear the judgment for someone else?\u201d</p>\n<p>Titus did not answer.</p>\n<p>Centurion said,</p>\n<p>\u201cBut God can.\u201d</p>\n<p>\u201cHe gave His Son to us.\u201d</p>\n<p>\u201cJesus is not merely my Teacher.\u201d</p>\n<p>\u201cHe is the Son of God.\u201d</p>\n<p>\u201cOnly the sinless Son of God could bear such a burden.\u201d</p>\n<p>\u201cThis is the greatest gift God has ever given to humanity.\u201d</p>\n<p>\u201cHe is changing the destiny of the human race.\u201d</p>\n<p>The two men continued along the road. Other followers of Jesus, also carrying burdens they had been forced to carry, were talking about what they had seen\u2014the risen Christ. Titus listened to their voices. After a while, he said,</p>\n<p>\u201cDeath is the devil's strongest weapon against humanity.\u201d</p>\n<p>Centurion looked at him. Titus continued.</p>\n<p>\u201cThe devil can tempt human desires.\u201d</p>\n<p>\u201cHe can make people lust, become greedy, steal, and commit evil.\u201d</p>\n<p>\u201cPeople break God's law, and in the end they must face death.\u201d</p>\n<p>\u201cThen the devil uses their sin and death to accuse them and hold them captive.\u201d</p>\n<p>\u201cIsn't that terrible?\u201d</p>\n<p>\u201cThat is why the salvation the Father has given to the world is an incomparable gift,\u201d Centurion answered.</p>\n<p>Titus remembered something he had once heard someone say:</p>\n<p>\u201cHe will swallow up death forever and wipe away the tears from every face.\u201d</p>\n<p>His voice grew quieter.</p>\n<p>\u201cRedemption is the road by which a person leaves sin and death and enters the kingdom of God.\u201d</p>\n<p>\u201cJust as Peter said: \u2018Repent. Leave this crooked generation behind.' \u201d</p>\n<p>Titus was silent for a long time. He did not argue anymore. He was beginning to understand. The real question was not whether there were good people in the world. The real question was whether anyone could become perfectly holy by relying on his own goodness.</p>\n<p>It was precisely because the holy Father exists that human sin revealed its true horror.</p>\n<p>\u201cThen what about grace?\u201d Titus suddenly asked.</p>\n<p>\u201cIf sin is so great, is grace greater still?\u201d</p>\n<p>\u201cYes,\u201d Centurion said with a smile.</p>\n<p>He thought for a moment. Then he said,</p>\n<p>\u201cI used to think too little of sin and too much of myself.\u201d</p>\n<p>\u201cNow I understand.\u201d</p>\n<p>\u201cWhere sin abounds, grace abounds even more.\u201d</p>\n<p>\u201cSin is like a small jar of dirty water.\u201d</p>\n<p>\u201cBut grace is like a vast cistern of clear water.\u201d</p>\n<p>\u201cNo matter how much dirty water there is, it cannot turn the whole cistern into dirty water.\u201d</p>\n<p>\u201cBecause the clear water keeps flowing in.\u201d</p>\n<p>Titus lowered his head and thought.</p>\n<p>\u201cThat would require a great deal of water. A very great deal.\u201d</p>\n<p>Centurion nodded. \u201cExactly.\u201d</p>\n<p>Then he continued, \u201cIf someone refuses such a great salvation and stands naked before the judgment seat, how miserable will he be?\u201d</p>\n<p>\u201cHe will have nothing with which to cover his nakedness.\u201d</p>\n<p>\u201cIn the end, he will have to face everlasting death.\u201d</p>\n<p>Titus stopped walking. He looked at Centurion.</p>\n<p>\u201cCan you teach me how to pray?\u201d</p>\n<p>Centurion looked into his eyes. He saw the questions in Titus's heart slowly becoming trust. The two men stopped beside the Roman road. Centurion led Titus in praying the Lord's Prayer.</p>\n<p>The other followers of Jesus, who were being forced to carry heavy burdens along the road, saw Titus turn to the Lord, and they rejoiced.</p>\n<p>Titus's decision was courageous. Centurion's decision to walk two miles with him was courageous, too. And I watched all of this from high above.</p>\n<p>I saw the broad Roman road filled with Christians who were willing to walk an extra mile. They cared about the salvation of other people's souls. They were doing what my Master had taught them:</p>\n<blockquote>\u201cIf anyone forces you to go one mile,<br>\ngo with them two miles.\u201d</blockquote>\n<p>Suddenly, I understood. The glory of my Lord Jesus was not revealed only on the morning when He rose from the dead. It was also shining on this Roman road.</p>\n<p>When someone is willing to walk an extra mile, when someone is willing to lay down his rights, when someone is willing to stop for the sake of another person's soul, that, too, is the glory of my Lord Jesus.</p>", "questions": [{"level": 1, "prompt": "What Roman rule allowed soldiers like Titus to force people to carry loads for them?", "choices": ["Soldiers could compel local people to carry supplies for one mile", "Soldiers had to carry their own supplies", "Only farmers could carry loads", "There was no such rule"], "correct": 0}, {"level": 2, "prompt": "Centurion explains that a person's goodness \u201ccan never remain perfect forever\u201d because of things like temptation, money, or power. Why does he bring this up to Titus?", "choices": ["To brag about his own past crimes", "To show that no human being can be perfectly good on their own, which is why humanity needed someone else who truly was perfect", "To convince Titus to give him money", "To argue that all people are equally evil and nothing matters"], "correct": 1}, {"level": 3, "prompt": "The chapter ends with the idea that Jesus's glory is shown not only in His resurrection, but in someone \u201cwilling to walk an extra mile\u201d for another person's sake. What is this chapter's big idea?", "choices": ["Walking is good exercise for Roman soldiers", "Living out kindness and generosity in small, everyday choices can reflect the same glory as a miracle", "Only soldiers can show true kindness", "Titus was forced to become a Christian"], "correct": 1}]}, {"id": 12, "title": "Chapter 12: The Throne in Heaven", "text": "<img class=\"chapter-illustration\" src=\"images/ch12/ch12_fig1.jpg\" alt=\"Illustration for Chapter 12\" loading=\"lazy\">\n<p>Shrubs growing from the cracks in the cliffs clothed the mountainside in everlasting green. The setting sun painted the sheer rock faces with shades of orange and gold.</p>\n<p>Today, I circled high above the cliffs. Many young eagles were practicing their dives and learning how to catch fish.</p>\n<p>They reminded me of myself. I remembered how my golden eagle teacher had trained me when I was young.</p>\n<p>A young eagle came to rest beside me. It had been trying all day. I talked with it and taught it to watch carefully where the fish were swimming, to wait for the right moment, and then to dive from high above and seize the fish. At first, it was reluctant. But it still tried the way I had taught it.</p>\n<p>Later, it caught a fish. The success filled it with joy.</p>\n<p>Then I continued teaching it about spiritual vision.</p>\n<p>\u201cWhen you look at the world, first look up at the sun. Follow the light as you look at everything before you. Do not look only at what your eyes can see. Learn also to discern the good and the evil that the light reveals.\u201d</p>\n<p>I spoke at length because these were things I had learned myself.</p>\n<p>The young eagle listened, and then told the other eagles what I had taught it. Before long, several young eagles came to me and asked me to teach them. So I flew with them. We learned together how to see.</p>\n<p>Spiritual vision is taught one eagle at a time, just as my golden eagle teacher had trained me. I remembered how he endured all my complaints, and how he encouraged me whenever I failed again and again.</p>\n<img class=\"chapter-illustration\" src=\"images/ch12/ch12_fig2.jpg\" alt=\"Illustration for Chapter 12\" loading=\"lazy\">\n<p>I saw that my Master Jesus did the same thing on earth. He chose His disciples and trained them one by one. He was often with them. Although His disciples respected Him deeply, some of them had tempers, and sometimes they argued with one another. I saw that Jesus did not stay with them only when they did well. He walked with them and taught them along the way. Sometimes He rebuked them. Sometimes He patiently answered their questions. Sometimes He said nothing at all, but simply let them watch what He did. Little by little, He changed them.</p>\n<p>I wanted to remain with these young eagles forever. My heart was glad, and my spirit rejoiced. I wanted to stay in this sky and watch these young eagles learn to fly. I praised my Master. I said:</p>\n<p>\u201cGlory, glory, glory!\u201d</p>\n<p>My eyes have seen You. I fix my gaze upon You. My heart belongs to You alone.</p>\n<hr class=\"scene-break\">\n<p>I looked toward the sun. A company of golden eagles came flying toward us from the direction of the light. It was my golden eagle teacher and my companions. Behind them flew two angels. They had once sent me to carry Stephen, who had been stoned to death, to the throne in heaven. I remembered how exhausted I had been after that flight. Yet when Stephen arrived safely before the throne, I realized how small my own effort had been.</p>\n<p>This time, I heard the angels call to me:</p>\n<p>\u201cCome. Your next task is waiting.\u201d</p>\n<p>They told me what I was to do.</p>\n<p>On this journey, I flew with many golden eagles and angels of heaven. We climbed higher and higher until the mountains of the earth slowly disappeared beneath the clouds. As we drew near the glassy sea of heaven, I heard loud thunder and awesome rumblings. I also heard the songs of worship. I did not know what would happen next.</p>\n<p>I saw a vast sea of glass, clear as crystal. The throne was surrounded by a rainbow resembling an emerald, flashing with lightning and echoing with thunder. Around the throne stood figures dressed in white, with golden crowns upon their heads. I counted them. There were twenty-four elders.</p>\n<p>Around the throne were four great living creatures. They worshiped the eternal Creator before the throne and led the worship of heaven. They moved with wings. The first was like a lion. The second was like an ox. The third had a face like a man. The fourth was like a flying eagle. Each had six wings. Day and night they never stopped crying out, in perfect harmony:</p>\n<blockquote>\u201cHoly, holy, holy,<br>\nLord God Almighty,<br>\nwho was, and is, and is to come!\u201d</blockquote>\n<img class=\"chapter-illustration\" src=\"images/ch12/ch12_fig3.jpg\" alt=\"Illustration for Chapter 12\" loading=\"lazy\">\n<p>Their voices grew louder until they filled all of heaven.</p>\n<p>Whenever they gave glory, honor, and thanks to the King upon the throne, the twenty-four elders fell down before the Creator.</p>\n<p>They laid their crowns before the throne and said:</p>\n<blockquote>\u201cOur Lord and our God,<br>\nYou are worthy to receive glory, honor, and power,<br>\nfor You created all things,<br>\nand by Your will they were created\\\nand have their being.\u201d</blockquote>\n<hr class=\"scene-break\">\n<p>In heaven, I heard the angels passing a message from one to another. The whole sky became solemn. They were preparing for something. No one explained it directly to me. But in the voices moving through heaven, I heard it:</p>\n<blockquote>The judgment of the whole earth was about to begin.</blockquote>\n<p>I remembered when my Master Jesus was still on earth. He had told the people that the kingdom of heaven was near and that they should repent. He had also warned them that one day judgment would come.</p>\n<p>Was this that day?</p>\n<p>Once, I had flown above the crowds while He spoke. Some heard His words but refused to turn back. Some even hated Him. I could not understand why people would reject a Master who loved them so deeply. Now I understood. The day He had spoken about had come. All of us golden eagles stopped beating our wings and hovered above the glassy sea.</p>\n<hr class=\"scene-break\">\n<p>The Creator seated upon the throne was surrounded by glorious light. In His hand was a scroll. I heard a mighty angel proclaim with a loud voice:</p>\n<p>\u201cWho is worthy to open the scroll?\u201d</p>\n<p>I heard someone weeping. It was John. I had seen him before\u2014the John who had followed my Master Jesus. He saw that no creature in heaven or on earth was worthy to open the scroll, and he wept bitterly. Then one of the elders said to him:</p>\n<p>\u201cDo not weep. Behold, the Lion of the tribe of Judah, the Root of David, has conquered. He is worthy to open the scroll and to break its seven seals.\u201d</p>\n<p>Little by little, I began to understand. The scroll contained God's judgment upon the world. Once it was opened, and the seven seals were broken one by one, terrible things would unfold upon the earth.</p>\n<img class=\"chapter-illustration\" src=\"images/ch12/ch12_fig4.jpg\" alt=\"Illustration for Chapter 12\" loading=\"lazy\">\n<p>Then I saw my Lord Jesus come before the throne. He looked like a Lamb who had been slain. I knew Him.</p>\n<p>It was my Master Jesus. I remembered the day He was crucified. I had cried that day. I had asked my Master:</p>\n<p>\u201cThey have treated You with such cruelty. Why do You say nothing?\u201d</p>\n<p>Now He came forward and took the scroll from the right hand of the One seated upon the throne. At that moment, the twenty-four elders fell down together and began to sing a new song:</p>\n<blockquote>\u201cYou are worthy to take the scroll<br>\nand to open its seals,<br>\nfor You were slain,<br>\nand with Your blood You purchased people for God<br>\nfrom every tribe and language and people and nation.<br>\nYou have made them a kingdom and priests to our God,<br>\nand they shall reign upon the earth.\u201d</blockquote>\n<p>When the elders had finished singing, countless angels surrounded the throne, the living creatures, and the elders.</p>\n<p>They sang:</p>\n<blockquote>\u201cWorthy is the Lamb who was slain,<br>\nto receive power and riches and wisdom and strength,<br>\nhonor and glory and praise!\u201d</blockquote>\n<p>Then I heard praise rising from heaven and earth, from beneath the earth and from the sea\u2014from every creature in all creation. Birds filled the sky with their cries. The waters were alive with their voices. The earth itself seemed to answer with the sounds of countless creatures. Their voices intertwined and rose into a magnificent harmony throughout heaven. They said:</p>\n<blockquote>\u201cTo Him who sits upon the throne<br>\nand to the Lamb<br>\nbe praise and honor and glory and power,<br>\nforever and ever!\u201d</blockquote>\n<p>I looked up at the Lamb. He held the scroll. I knew that next He would break the first seal.</p>\n<hr class=\"scene-break\">\n<p>I saw the judgment of God unfold one seal at a time. The Lamb opened the first four seals. Each time a seal was broken, one of the four living creatures called out with a mighty voice:</p>\n<p>\u201cCome!\u201d</p>\n<img class=\"chapter-illustration\" src=\"images/ch12/ch12_fig5.jpg\" alt=\"Illustration for Chapter 12\" loading=\"lazy\">\n<p>Then I saw four riders appear, one after another. A white horse. A red horse. A black horse. A pale horse. They went out across the earth. War, famine, and death followed them.</p>\n<hr class=\"scene-break\">\n<p>The fifth seal was opened. I heard the cries of those who had been killed because they had borne witness to the word of God. They cried out from beneath the altar:</p>\n<blockquote>\u201cSovereign Lord, holy and true,<br>\nhow long before You judge those <br> \nwho dwell on the earth <br>\nand avenge our blood?\u201d</blockquote>\n<p>I heard their voices. They were people who had once borne witness to my Master. Now they were dead. They had not forgotten God. They had not denied His name. Now they cried out before Him for justice. I saw each of them receive a white robe. A voice told them to rest a little longer, until the number of their fellow servants and brothers and sisters who would also be killed, as they had been, was complete.</p>\n<hr class=\"scene-break\">\n<p>Then the sixth seal was opened. The stars of heaven fell to the earth, one after another, like figs falling from a fig tree shaken violently by a great wind. Mountains and islands were moved from their places. An earthquake came upon the earth. No one had ever seen such a terrible disaster. I saw the kings of the earth crying out:</p>\n<blockquote>\u201cFall on us!<br>\nHide us from the face of the One <br>\nseated on the throne<br>\nand from the wrath of the Lamb!\u201d</blockquote>\n<p>I saw them running in panic, searching for places to hide. Some fell to the ground. Some curled themselves behind the rocks, their eyes filled with terror. But there was no corner that could hide them. No mountain could cover them.</p>\n<p>In heaven, I saw the people who had been redeemed. They came from every nation, tribe, people, and language. They stood before the throne and before the Lamb, clothed in white robes, holding palm branches in their hands.</p>\n<p>They sang a song that no other creature could sing. It was the song of those who had known tears, who had passed through death, and who had been redeemed by the Lamb. One by one, generation after generation, they had been redeemed by Him. Their song softened the sorrow of heaven and earth. Their voices sang of the joy of redemption. They cried out:</p>\n<blockquote>\u201cSalvation belongs to our God<br>\nwho sits upon the throne,<br>\nand to the Lamb!\u201d</blockquote>\n<p>I remembered something the apostle John had once said: If everything Jesus had done were written down one by one, the whole world could not contain the books that would be written. Now, as I looked upon all these people redeemed by the Lamb, I suddenly understood. How much more was there than all the things Jesus had done while He walked upon the earth? Every redeemed person had a story. I looked at them and remembered the people I had seen weeping on the earth. Some of their tears I had watched from high above. Some of their suffering I could only watch from a distance. But now, before the throne, I saw the truth: Not one tear had been forgotten.</p>\n<hr class=\"scene-break\">\n<p>Then the seventh seal was opened. Silence fell over heaven. It was like the pause between two notes of music. Everyone held their breath.</p>\n<p>Then, suddenly, the trumpets sounded. Seven angels blew seven trumpets. Each trumpet released another great and terrible judgment upon the earth.</p>\n<p>I saw the earth tremble. I saw fire and smoke rising. I saw people fleeing in terror. How I longed for them to turn back.</p>\n<p>\u201cRepent! Repent! There is still time!\u201d</p>\n<p>I cried out from the sky. But I saw that they still refused to repent. The rest of mankind, those who had not been killed by these plagues, still would not repent. Instead, they clenched their fists and cursed the God of heaven.</p>\n<p>I also saw people stealing. Some broke into their neighbors' homes and took what they had stored away. The disasters came. The earth shook. People knew that judgment had arrived. And yet they still clung tightly to their idols and possessions. They still refused to turn back. I wept in the sky. Why? You have seen all these things. Why will you still not return to the Lord who created you?</p>\n<hr class=\"scene-break\">\n<p>Then it was my turn to speak. When the fourth angel sounded his trumpet, I knew my moment had come. I cried out across the heavens:</p>\n<blockquote>\u201cWoe! Woe! Woe<br>\nto those who dwell on the earth,<br>\nfor the remaining three angels<br>\nare about to sound their trumpets!\u201d</blockquote>\n<p>I continued flying through the sky. Then I saw three angels flying above the earth. One of them was proclaiming the eternal gospel to every nation, tribe, language, and people. I understood then that even after judgment had begun, the call of the gospel had not ceased. I heard his voice:</p>\n<blockquote>\u201cFear God and give Him glory,<br>\nbecause the hour of His judgment has come.<br>\nWorship Him who made heaven and earth,<br>\nthe sea and the springs of water.\u201d</blockquote>\n<p>I understood. Before the final judgment came, God was still calling people to repent.</p>\n<hr class=\"scene-break\">\n<p>I know that you humans wrote these things down in a book called the Bible. It also records many things I never saw with my own eyes. Later, I saw tyrants throughout the generations try to burn the Bible and erase it from the earth. But instead, it spread from generation to generation. People tried to extinguish the words of my Master. But the light of those words only shone farther across the earth.</p>\n<p>That book records the Creator. It also records His plan to save humanity. And we eagles are part of that story.</p>\n<p>I once thought that all I could see was the sky, the mountains, the rivers, and the earth. Then I saw Jesus. I saw Him walking among people. I saw Him suffer. I saw Him nailed to the cross. I saw Him rise from the dead. I carried Stephen into heaven. And now I fly once more before the throne. I have seen the Lamb open the scroll. I have seen all creation bow before Him in worship. The glory I have seen is my Master.</p>\n<blockquote>\u201cI tell you, if they keep silent,\\\nthe stones will cry out.\u201d</blockquote>\n<blockquote>The End</blockquote>", "questions": [{"level": 1, "prompt": "What did the four living creatures around the throne look like?", "choices": ["A lion, an ox, a creature with a man's face, and a flying eagle", "Four identical angels", "Four different colored horses", "Four rivers of light"], "correct": 0}, {"level": 2, "prompt": "Why was John weeping when no one was found worthy to open the scroll?", "choices": ["He was afraid of the loud thunder", "It seemed like no one\u2014in heaven or on earth\u2014was worthy enough to open it, which felt hopeless", "He missed his home", "The angels told him to cry"], "correct": 1}, {"level": 3, "prompt": "The eagle spends the whole book learning to \u201csee the glory,\u201d and in this final chapter he finally stands before the throne of heaven. How does this chapter complete the eagle's journey that began in Chapter 1?", "choices": ["He learns one more fishing technique", "His long practice of looking past the surface\u2014from fish, to people's hearts, to Jesus Himself\u2014leads him all the way to witnessing the true glory of God in heaven", "He becomes the leader of all eagles", "He forgets everything his teacher taught him"], "correct": 1}]}]};

/* ============================================================
   GAME STATE
   ============================================================ */
const STAR_VALUES = { 1: 1, 2: 2, 3: 3 };
const POINTS_PER_STAR = 10;
const LEVEL_LABEL = { 1: "Spot It", 2: "Figure It Out", 3: "Big Idea" };

let currentUser = null;   // Firebase user object
let currentUserDisplayName = "";
let state = null;         // loaded from / synced to Firestore
let currentChapterId = null;
let currentQuestionIndex = 0;

const app = document.getElementById('app');
const topHeader = document.getElementById('topHeader');
const pageFooter = document.getElementById('pageFooter');

function emptyState(){
  const chapterProgress = {};
  BOOK.chapters.forEach(c => chapterProgress[c.id] = { starsEarned: 0, answered: [false,false,false] });
  return { totalStars: 0, totalPoints: 0, chapterProgress };
}

/* ---------- audio ---------- */
let audioCtx = null;
function getCtx(){
  if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  return audioCtx;
}
function playTone(freq, start, duration, gain){
  const ctx = getCtx();
  const osc = ctx.createOscillator();
  const g = ctx.createGain();
  osc.type = 'sine';
  osc.frequency.value = freq;
  g.gain.value = 0;
  osc.connect(g).connect(ctx.destination);
  const t0 = ctx.currentTime + start;
  g.gain.setValueAtTime(0, t0);
  g.gain.linearRampToValueAtTime(gain, t0 + 0.02);
  g.gain.exponentialRampToValueAtTime(0.001, t0 + duration);
  osc.start(t0);
  osc.stop(t0 + duration + 0.05);
}
function playCorrectChime(level){
  const notes = [523.25, 659.25, 783.99];
  notes.forEach((f,i) => playTone(f, i*0.09, 0.35, 0.18));
  if(level === 3) playTone(1046.5, 0.27, 0.4, 0.15);
}
function playTryAgainTone(){
  playTone(311.13, 0, 0.25, 0.12);
}

/* ============================================================
   LOGIN
   ============================================================ */
function slugify(name){
  return name.trim().toLowerCase().replace(/[^a-z0-9]/g, '');
}

function renderLogin(errorMsg, prefillName, prefillPin){
  topHeader.style.display = 'none';
  pageFooter.style.display = 'none';
  app.innerHTML = `
    <div class="panel login-panel">
      <a href="index.html" style="color:var(--sky-deep);font-weight:700;font-size:.85rem;text-decoration:none;">&larr; Read the book (no login needed)</a>
      <p class="eyebrow" style="margin-top:14px;">EAGLE READING QUEST</p>
      <h2>What's your reading name?</h2>
      <p style="color:#4A6270;font-weight:600;margin-top:-8px;">This login is only for the quiz game — anyone can read the book for free. Use a nickname your teacher will recognize; no email needed.</p>
      <div class="field">
        <label for="nameInput">Reading name</label>
        <input id="nameInput" type="text" maxlength="24" placeholder="e.g. Sam or SkyHawk7" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" value="${prefillName ? escapeAttr(prefillName) : ''}">
      </div>
      <div class="field">
        <label for="pinInput">Secret code (6 digits)</label>
        <input id="pinInput" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="6" placeholder="e.g. 482913" autocomplete="one-time-code" autocapitalize="off" autocorrect="off" spellcheck="false" value="${prefillPin ? escapeAttr(prefillPin) : ''}">
        <div class="hint">Remember this code — you'll use it to log back in next time. Ask a grown-up to help you remember it.</div>
      </div>
      <div class="actions">
        <button id="loginBtn">Start reading</button>
      </div>
      <div class="login-error">${errorMsg ? errorMsg : ''}</div>
    </div>`;

  const pinEl = document.getElementById('pinInput');
  pinEl.addEventListener('input', () => {
    pinEl.value = pinEl.value.replace(/\D/g, '').slice(0, 6);
  });
  document.getElementById('loginBtn').addEventListener('click', handleLogin);
  pinEl.addEventListener('keydown', e => { if(e.key === 'Enter') handleLogin(); });
}

function escapeAttr(s){
  return String(s).replace(/"/g, '&quot;');
}

function renderLoading(msg){
  app.innerHTML = `<div class="login-loading">${msg || 'Loading…'}</div>`;
}

async function handleLogin(){
  const nameRaw = document.getElementById('nameInput').value;
  const pin = document.getElementById('pinInput').value;
  const slug = slugify(nameRaw);

  if(!slug){
    renderLogin('Please type a reading name using letters or numbers.', nameRaw, pin);
    return;
  }
  if(!/^\d{6}$/.test(pin)){
    renderLogin('Your secret code must be exactly 6 digits (numbers only). If your browser auto-filled this box, please clear it and type the 6 digits yourself.', nameRaw, '');
    return;
  }

  const email = `${slug}@${AUTH_EMAIL_DOMAIN}`;
  renderLoading('Logging in…');

  try {
    await auth.createUserWithEmailAndPassword(email, pin);
    await auth.currentUser.updateProfile({ displayName: nameRaw.trim() });
    await db.collection('scores').doc(auth.currentUser.uid).set({
      name: nameRaw.trim(),
      totalStars: 0,
      totalPoints: 0,
      chapters: {},
      updatedAt: firebase.firestore.FieldValue.serverTimestamp()
    });
  } catch (err) {
    if(err.code === 'auth/email-already-in-use'){
      try {
        await auth.signInWithEmailAndPassword(email, pin);
      } catch (err2) {
        renderLogin('That reading name is taken with a different code. Try another name, or double-check your code.', nameRaw, '');
        return;
      }
    } else if (err.code === 'auth/weak-password') {
      renderLogin('Please choose a 6-digit code.', nameRaw, '');
      return;
    } else {
      renderLogin('Something went wrong logging in. Please try again.', nameRaw, pin);
      return;
    }
  }
  // onAuthStateChanged will take it from here
}

function handleLogout(){
  auth.signOut();
}

/* ============================================================
   FIRESTORE SYNC
   ============================================================ */
async function loadStateFromFirestore(uid){
  const docSnap = await db.collection('scores').doc(uid).get();
  const s = emptyState();
  if(docSnap.exists){
    const data = docSnap.data();
    s.totalStars = data.totalStars || 0;
    s.totalPoints = data.totalPoints || 0;
    const savedChapters = data.chapters || {};
    BOOK.chapters.forEach(c => {
      const saved = savedChapters[String(c.id)];
      if(saved){
        s.chapterProgress[c.id] = {
          starsEarned: saved.starsEarned || 0,
          answered: saved.answered || [false,false,false]
        };
      }
    });
  }
  return s;
}

function persistChapterProgress(chapterId){
  if(!currentUser) return;
  const prog = state.chapterProgress[chapterId];
  const update = {
    totalStars: state.totalStars,
    totalPoints: state.totalPoints,
    name: currentUserDisplayName,
    updatedAt: firebase.firestore.FieldValue.serverTimestamp()
  };
  update[`chapters.${chapterId}`] = prog;
  db.collection('scores').doc(currentUser.uid).set(update, { merge: true })
    .catch(e => console.error('Sync failed (will retry next answer):', e));
}

/* ============================================================
   RENDERING — chapter picker, reading, quiz, summary
   ============================================================ */
function updateScoreboard(){
  document.getElementById('totalStars').textContent = state.totalStars;
  document.getElementById('totalPoints').textContent = state.totalPoints;
}

function renderChapterPicker(){
  currentChapterId = null;
  topHeader.style.display = 'flex';
  pageFooter.style.display = 'block';
  updateScoreboard();
  let html = `<div class="panel">
    <p class="eyebrow">CHOOSE A CHAPTER</p>
    <h2 style="margin:0 0 4px;color:var(--sky-deep);">${BOOK.title}</h2>
    <p style="margin:0 0 14px;color:#4A6270;font-weight:600;">Welcome back, ${currentUserDisplayName}! Read a chapter, then answer three questions to earn stars.</p>
    <div class="chapter-grid">`;
  BOOK.chapters.forEach(c => {
    const prog = state.chapterProgress[c.id];
    const done = prog.answered.every(Boolean);
    const starIcons = [0,1,2].map(i => prog.answered[i] ? '⭐' : '☆').join('');
    html += `<div class="chapter-card ${done ? 'done' : ''}" data-id="${c.id}">
      <div class="num">Ch. ${c.id}</div>
      <div class="name">${c.title.replace(/^Chapter \d+:\s*/,'')}</div>
      <div class="stars-mini">${starIcons}</div>
    </div>`;
  });
  html += `</div></div>`;
  app.innerHTML = html;
  document.querySelectorAll('.chapter-card').forEach(el => {
    el.addEventListener('click', () => openChapter(parseInt(el.dataset.id)));
  });
}

function openChapter(id){
  currentChapterId = id;
  currentQuestionIndex = 0;
  renderReading();
}

function getChapter(id){
  return BOOK.chapters.find(c => c.id === id);
}

function renderReading(){
  const c = getChapter(currentChapterId);
  app.innerHTML = `
    <div class="panel">
      <p class="eyebrow">CHAPTER ${c.id}</p>
      <h2 style="margin:0 0 12px;color:var(--sky-deep);">${c.title}</h2>
      <div class="chapter-text">${c.text}</div>
      <div class="actions">
        <button id="startQuiz">I've read it — start the questions</button>
        <button class="secondary" id="backToPicker" style="color:var(--sky-deep);border-color:#B9C8CE;">Back to chapters</button>
      </div>
    </div>`;
  document.getElementById('startQuiz').addEventListener('click', () => {
    currentQuestionIndex = 0;
    renderQuestion();
  });
  document.getElementById('backToPicker').addEventListener('click', renderChapterPicker);
}

function renderQuestion(){
  const c = getChapter(currentChapterId);
  const q = c.questions[currentQuestionIndex];
  const pct = Math.round((currentQuestionIndex) / c.questions.length * 100);

  app.innerHTML = `
    <div class="panel level-${q.level}">
      <p class="eyebrow">CHAPTER ${c.id} · QUESTION ${currentQuestionIndex+1} OF ${c.questions.length}</p>
      <div class="level-badge">Level ${q.level}: ${LEVEL_LABEL[q.level]} · worth ${STAR_VALUES[q.level]} ⭐</div>
      <div class="question-text">${q.prompt}</div>
      <div class="choices" id="choices">
        ${q.choices.map((choice, i) => `<button class="choice" data-i="${i}">${choice}</button>`).join('')}
      </div>
      <div class="feedback" id="feedback"></div>
      <div class="progress-bar"><div style="width:${pct}%"></div></div>
      <div class="actions" id="nextActions" style="display:none;">
        <button id="nextBtn">Continue</button>
      </div>
    </div>`;

  document.querySelectorAll('.choice').forEach(btn => {
    btn.addEventListener('click', () => handleAnswer(btn, q));
  });
}

function handleAnswer(btn, q){
  const chosen = parseInt(btn.dataset.i);
  const allChoices = document.querySelectorAll('.choice');
  allChoices.forEach(b => b.disabled = true);
  const feedback = document.getElementById('feedback');
  const nextActions = document.getElementById('nextActions');

  if(chosen === q.correct){
    btn.classList.add('correct');
    feedback.textContent = correctFeedback(q.level);
    feedback.className = 'feedback good';
    awardStars(q.level);
    playCorrectChime(q.level);
    launchStarBurst(q.level);
    nextActions.style.display = 'flex';
  } else {
    btn.classList.add('wrong');
    feedback.textContent = "Not quite — take another look and try again!";
    feedback.className = 'feedback bad';
    playTryAgainTone();
    setTimeout(() => {
      allChoices.forEach(b => { if(b !== btn) b.disabled = false; });
      btn.disabled = true;
    }, 500);
  }
  document.getElementById('nextBtn')?.addEventListener('click', goNext);
}

function correctFeedback(level){
  if(level === 1) return "Nice catch! ⭐";
  if(level === 2) return "Great thinking — you figured it out! ⭐⭐";
  return "Wow, that's real insight! ⭐⭐⭐";
}

function awardStars(level){
  const stars = STAR_VALUES[level];
  const points = stars * POINTS_PER_STAR;
  state.totalStars += stars;
  state.totalPoints += points;
  const prog = state.chapterProgress[currentChapterId];
  prog.answered[level-1] = true;
  prog.starsEarned += stars;
  updateScoreboard();
  persistChapterProgress(currentChapterId);
}

function launchStarBurst(level){
  const count = STAR_VALUES[level];
  const burst = document.createElement('div');
  burst.style.position = 'fixed';
  burst.style.top = '18px';
  burst.style.right = '18px';
  burst.style.fontSize = '1.8rem';
  burst.style.pointerEvents = 'none';
  burst.style.zIndex = '999';
  burst.textContent = '⭐'.repeat(count);
  burst.style.transition = 'transform .8s ease, opacity .8s ease';
  document.body.appendChild(burst);
  requestAnimationFrame(() => {
    burst.style.transform = 'translateY(-30px)';
    burst.style.opacity = '0';
  });
  setTimeout(() => burst.remove(), 850);
}

function goNext(){
  const c = getChapter(currentChapterId);
  if(currentQuestionIndex < c.questions.length - 1){
    currentQuestionIndex++;
    renderQuestion();
  } else {
    renderChapterSummary();
  }
}

function renderChapterSummary(){
  const c = getChapter(currentChapterId);
  const prog = state.chapterProgress[c.id];
  const allChaptersDone = BOOK.chapters.every(ch => state.chapterProgress[ch.id].answered.every(Boolean));

  app.innerHTML = `
    <div class="panel summary">
      <p class="eyebrow">CHAPTER ${c.id} COMPLETE</p>
      <h2>Great reading, eagle! 🦅</h2>
      <p style="font-weight:700;">You earned <strong>${prog.starsEarned} stars</strong> and <strong>${prog.starsEarned * POINTS_PER_STAR} points</strong> on this chapter.</p>
      <div class="actions">
        ${c.id < BOOK.chapters.length ? `<button id="nextChapter">Next chapter →</button>` : ``}
        <button class="secondary" id="toPicker" style="color:var(--sky-deep);border-color:#B9C8CE;">All chapters</button>
      </div>
      ${allChaptersDone ? `<p style="margin-top:16px;font-weight:800;color:var(--leaf-teal);">🏅 You've finished every chapter of ${BOOK.title}! Total: ${state.totalStars} stars, ${state.totalPoints} points.</p>` : ``}
    </div>`;

  document.getElementById('toPicker').addEventListener('click', renderChapterPicker);
  const nextBtn = document.getElementById('nextChapter');
  if(nextBtn){
    nextBtn.addEventListener('click', () => openChapter(c.id + 1));
  }
}

/* ============================================================
   AUTH STATE
   ============================================================ */
document.getElementById('logoutBtn').addEventListener('click', handleLogout);

auth.onAuthStateChanged(async (user) => {
  if(user){
    currentUser = user;
    currentUserDisplayName = user.displayName || 'Reader';
    renderLoading('Loading your progress…');
    state = await loadStateFromFirestore(user.uid);
    const params = new URLSearchParams(window.location.search);
    const chParam = parseInt(params.get('ch'));
    if(chParam && getChapter(chParam)){
      currentChapterId = chParam;
      currentQuestionIndex = 0;
      topHeader.style.display = 'flex';
      pageFooter.style.display = 'block';
      updateScoreboard();
      renderQuestion();
    } else {
      renderChapterPicker();
    }
  } else {
    currentUser = null;
    state = null;
    renderLogin();
  }
});
</script>
